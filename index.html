/* =====================================================================
 *  BuildLedger — Construction Materials & Project Debt Management
 *  Kiến trúc: 1 file, không build step.
 *    1. Utilities          – định dạng tiền tệ, ngày, escape HTML
 *    2. Seed data          – dữ liệu mẫu ngành xây dựng Việt Nam
 *    3. Store              – state + persistence (localStorage)
 *    4. API layer          – điểm tích hợp backend (REST / Firebase)
 *    5. Selectors          – tính toán dẫn xuất (tồn kho, công nợ, cảnh báo)
 *    6. UI primitives      – modal, toast, form validation, badges
 *    7. Views              – Dashboard, Inventory, Projects, Suppliers, Ledger
 *    8. Modals             – Vật tư, Thanh toán, Xuất vật tư, Nhà cung cấp

 * ===================================================================== */

/* ============ 1. UTILITIES ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 3 });
const fmtNum = n => nf.format(n);
const fmtVND = n => new Intl.NumberFormat('vi-VN').format(Math.round(n)) + ' ₫';
const fmtCompact = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + ' tỷ';
  if (a >= 1e6) return (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' tr';
  return new Intl.NumberFormat('vi-VN').format(Math.round(n));
};
const isoOf = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const todayISO = () => isoOf(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); };

const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);

const uid = p => p + Date.now().toString(36).slice(-6) + Math.random().toString(36).slice(2, 5);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const round3 = n => Math.round(n * 1000) / 1000;

/* ============ 3. STORE (state + persistence) ============ */
const STORAGE_KEY = 'buildledger.state.v1';
const Store = {
  state: null,
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { this.state = JSON.parse(raw); return; }
    } catch (e) { /* storage unavailable → dùng dữ liệu mẫu */ }
    this.state = buildSeed();
  },
  save() {
    this.state.updatedAt = new Date().toISOString();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); } catch (e) {}
  },
  reset() { this.state = buildSeed(); this.save(); }
};

/* ============ 4. API LAYER ============
 * Mọi thao tác ghi dữ liệu đều đi qua object này.
 * Để kết nối backend: thay phần thân mỗi hàm bằng fetch()/Firebase SDK,
 * giữ nguyên chữ ký (async, trả về object đã lưu) – UI không cần sửa.
 *
 *   const BASE_URL = 'https://api.your-company.vn/v1';
 *   const res = await fetch(`${BASE_URL}/materials`, { method: 'POST',
 *     headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
 *     body: JSON.stringify(material) });
 *   return res.json();
 * ===================================== */
const API = {
  // TODO(API): GET /api/bootstrap  → { materials, projects, suppliers, payables, receivables }
  // Firebase: Promise.all([getDocs(collection(db,'materials')), ...])
  async fetchAll() { return Store.state; },

  // TODO(API): POST /api/materials (tạo mới) | PUT /api/materials/:id (cập nhật)
  async saveMaterial(mat) {
    const list = Store.state.materials;
    const i = list.findIndex(x => x.id === mat.id);
    if (i >= 0) list[i] = { ...list[i], ...mat };
    else list.push({ ...mat, id: uid('m') });
    Store.save();
    return mat;
  },

  // TODO(API): DELETE /api/materials/:id
  async deleteMaterial(id) {
    Store.state.materials = Store.state.materials.filter(m => m.id !== id);
    Store.save();
  },

  // TODO(API): POST /api/projects/:projectId/allocations  { materialId, qty, note }
  // Backend nên thực hiện trong 1 transaction: trừ tồn kho + ghi phiếu xuất kho.
  async allocateMaterial(projectId, materialId, qty, note) {
    const S = Store.state;
    const mat = S.materials.find(m => m.id === materialId);
    const prj = S.projects.find(p => p.id === projectId);
    if (!mat || !prj) throw new Error('Không tìm thấy dữ liệu');
    if (qty > mat.stock) throw new Error('Số lượng vượt tồn kho');
    mat.stock = round3(mat.stock - qty);
    let a = prj.alloc.find(x => x.m === materialId);
    if (!a) { a = { m: materialId, planned: qty, used: 0 }; prj.alloc.push(a); }
    a.used = round3(a.used + qty);
    a.planned = Math.max(a.planned, a.used);
    (prj.log ||= []).push({ date: todayISO(), materialId, qty, note });
    Store.save();
    return prj;
  },

  // TODO(API): POST /api/ledger/{payables|receivables}/:invoiceId/payments  { amount, date, method, note }
  async recordPayment(type, invoiceId, payment) {
    const list = type === 'ap' ? Store.state.payables : Store.state.receivables;
    const inv = list.find(x => x.id === invoiceId);
    if (!inv) throw new Error('Không tìm thấy hóa đơn');
    if (payment.amount > inv.total - inv.paid) throw new Error('Số tiền vượt số còn lại');
    inv.payments.push({ id: uid('pm'), ...payment });
    inv.paid += payment.amount;
    Store.save();
    return inv;
  },

  // TODO(API): POST /api/suppliers
  async saveSupplier(sup) {
    Store.state.suppliers.push({ ...sup, id: uid('s') });
    Store.save();
    return sup;
  }
};

/* ============ 5. SELECTORS (derived data) ============ */
const S = () => Store.state;
const matById = id => S().materials.find(m => m.id === id);
const supById = id => S().suppliers.find(s => s.id === id);
const prjById = id => S().projects.find(p => p.id === id);
const matValue = m => m.stock * m.price;
const remaining = inv => Math.max(0, inv.total - inv.paid);
const stockLevel = m => m.stock <= 0 ? 'out' : m.stock < m.minStock ? 'low' : 'ok';

function invStatus(inv) {
  if (remaining(inv) === 0) return 'paid';
  const d = daysFromToday(inv.due);
  if (d < 0) return 'overdue';
  if (d <= 7) return 'soon';
  return 'open';
}
function partyOf(type, inv) {
  if (type === 'ap') { const s = supById(inv.supplierId); return { name: s?.name || '—', sub: s?.contact || '' }; }
  const p = prjById(inv.projectId); return { name: p?.client || '—', sub: p?.name || '' };
}
function supplierStats(sid) {
  const inv = S().payables.filter(p => p.supplierId === sid);
  const total = inv.reduce((a, p) => a + p.total, 0);
  const paid = inv.reduce((a, p) => a + p.paid, 0);
  const debt = inv.reduce((a, p) => a + remaining(p), 0);
  const overdue = inv.filter(p => invStatus(p) === 'overdue').reduce((a, p) => a + remaining(p), 0);
  const open = inv.filter(p => remaining(p) > 0).sort((a, b) => a.due.localeCompare(b.due));
  return { count: inv.length, total, paid, debt, overdue, nextDue: open[0]?.due || null, openCount: open.length };
}
function projectHealth(p) {
  if (p.status === 'completed') return { delayed: false, expected: 100 };
  const total = Math.max(1, dayDiff(p.start, p.end));
  const expected = clamp(Math.round(dayDiff(p.start, todayISO()) / total * 100), 0, 100);
  const left = daysFromToday(p.end);
  if (left < 0) return { delayed: true, expected, reason: `Quá hạn bàn giao ${-left} ngày`, severity: 'high' };
  if (p.progress < expected - 15) return { delayed: true, expected, reason: `Thực tế ${p.progress}% / kế hoạch ${expected}%`, severity: 'mid' };
  return { delayed: false, expected };
}
function getAlerts() {
  const lowStock = S().materials.filter(m => stockLevel(m) !== 'ok')
    .sort((a, b) => a.stock / a.minStock - b.stock / b.minStock);
  const overdue = [
    ...S().payables.filter(i => invStatus(i) === 'overdue').map(i => ({ type: 'ap', inv: i })),
    ...S().receivables.filter(i => invStatus(i) === 'overdue').map(i => ({ type: 'ar', inv: i }))
  ].sort((a, b) => a.inv.due.localeCompare(b.inv.due));
  const delays = S().projects.map(p => ({ p, h: projectHealth(p) })).filter(x => x.h.delayed);
  return { lowStock, overdue, delays, total: lowStock.length + overdue.length + delays.length };
}

/** Gắn validation động cho form. rules: { fieldName: (value, form) => errorMsg | null } */
function bindValidation(form, rules, onChange) {
  const check = (name, show = true) => {
    const el = form.elements[name];
    if (!el || !rules[name]) return true;
    const err = rules[name](String(el.value).trim(), form);
    if (show) {
      el.classList.toggle('is-invalid', !!err);
      el.classList.toggle('is-valid', !err && el.value !== '');
      const p = form.querySelector(`[data-err="${name}"]`);
      if (p) { p.textContent = err || ''; p.classList.toggle('hidden', !err); }
    }
    return !err;
  };
  const handler = e => { if (e.target.name) { check(e.target.name); onChange && onChange(e.target.name, check); } };
  form.addEventListener('input', handler);
  form.addEventListener('change', handler);
  return () => Object.keys(rules).map(n => check(n)).every(Boolean);
}

/* ---------- 7.2 INVENTORY ---------- */
function filteredMaterials() {
  const { q, cat, level, sort, dir } = ui.inv;
  const k = q.trim().toLowerCase();
  const val = {
    code: m => m.code, name: m => m.name, category: m => m.category,
    stock: m => m.stock, price: m => m.price, value: m => matValue(m)
  }[sort];
  return S().materials
    .filter(m => cat === 'all' || m.category === cat)
    .filter(m => level === 'all' || (level === 'low' ? stockLevel(m) !== 'ok' : stockLevel(m) === 'ok'))
    .filter(m => !k || m.name.toLowerCase().includes(k) || m.code.toLowerCase().includes(k))
    .sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y, 'vi') : x - y) * dir; });
}

function invRows() {
  const list = filteredMaterials();
  if (!list.length) return `<tr><td colspan="8" class="px-6 py-16 text-center">
    <div class="inline-flex flex-col items-center text-slate-400">${icon('search-x', '!w-8 !h-8')}<span class="mt-2 text-sm">Không tìm thấy vật tư phù hợp</span></div></td></tr>`;
  return list.map(m => {
    const lv = stockLevel(m);
    const pct = m.minStock ? clamp(m.stock / (m.minStock * 2) * 100, 0, 100) : 100;
    const sup = supById(m.supplierId);
    return `<tr class="group hover:bg-emerald-50/40">
      <td class="px-4 py-3 font-mono text-xs font-semibold text-slate-500 whitespace-nowrap">${esc(m.code)}</td>
      <td class="px-4 py-3 min-w-[220px]">
        <div class="font-medium text-slate-900">${esc(m.name)}</div>
        <div class="text-xs text-slate-500 truncate max-w-[260px]">${sup ? 'NCC: ' + esc(sup.name) : '—'}</div>
      </td>
      <td class="px-4 py-3">${catBadge(m.category)}</td>
      <td class="px-4 py-3 text-right">
        <div class="num font-medium ${lv === 'ok' ? 'text-slate-900' : lv === 'low' ? 'text-amber-700' : 'text-rose-600'}">${fmtNum(m.stock)}</div>
        <div class="w-24 ml-auto mt-1">${progressBar(pct, lv === 'ok' ? 'bg-emerald-500' : lv === 'low' ? 'bg-amber-500' : 'bg-rose-500', 'h-1')}</div>
        ${lv !== 'ok' ? `<div class="text-[11px] mt-0.5 ${lv === 'low' ? 'text-amber-600' : 'text-rose-600'}">${lv === 'low' ? 'Dưới ngưỡng ' + fmtNum(m.minStock) : 'Hết hàng'}</div>` : ''}
      </td>
      <td class="px-4 py-3 text-slate-600">${esc(m.unit)}</td>
      <td class="px-4 py-3 text-right num text-slate-700 whitespace-nowrap">${fmtVND(m.price)}</td>
      <td class="px-4 py-3 text-right num font-semibold text-slate-900 whitespace-nowrap">${fmtVND(matValue(m))}</td>
      <td class="px-4 py-3 text-right whitespace-nowrap">
        <div class="inline-flex gap-1 lg:opacity-0 lg:group-hover:opacity-100 transition">
          <button data-action="material-edit" data-id="${m.id}" class="p-2 rounded-lg text-slate-500 hover:text-emerald-700 hover:bg-emerald-50" title="Sửa">${icon('pencil', '!w-4 !h-4')}</button>
          <button data-action="material-delete" data-id="${m.id}" class="p-2 rounded-lg text-slate-500 hover:text-rose-600 hover:bg-rose-50" title="Xóa">${icon('trash-2', '!w-4 !h-4')}</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function invSummary() {
  const list = filteredMaterials();
  const total = list.reduce((a, m) => a + matValue(m), 0);
  return `Hiển thị <b class="text-slate-800">${list.length}</b> / ${S().materials.length} mã · Giá trị: <b class="text-slate-800 num">${fmtVND(total)}</b>`;
}

function sortTh(key, label, align = 'left') {
  const active = ui.inv.sort === key;
  return `<th class="px-4 py-3 text-${align} font-medium">
    <button data-action="sort" data-key="${key}" class="inline-flex items-center gap-1 hover:text-slate-900 ${active ? 'text-slate-900' : ''}">
      ${label}${icon(active ? (ui.inv.dir === 1 ? 'arrow-up' : 'arrow-down') : 'arrow-up-down', active ? 'text-emerald-600' : 'opacity-40')}
    </button></th>`;
}

function renderInventory() {
  const cats = Object.keys(CATEGORIES);
  return `
  <div class="space-y-4">
    <div class="flex flex-col lg:flex-row lg:items-center gap-3">

        <select id="inv-level" class="${inputCls} !w-auto pr-8">
          <option value="all" ${ui.inv.level === 'all' ? 'selected' : ''}>Mọi mức tồn</option>
          <option value="low" ${ui.inv.level === 'low' ? 'selected' : ''}>Dưới ngưỡng an toàn</option>
          <option value="ok" ${ui.inv.level === 'ok' ? 'selected' : ''}>Tồn kho an toàn</option>
        </select>
        <button data-action="material-new" class="${btnPrimary}">${icon('plus', '!w-4 !h-4')} Thêm vật tư</button>
      </div>
    </div>

    ${card(`
      <div class="px-4 sm:px-5 py-3 border-b border-slate-100 flex items-center justify-between gap-3">
        <p id="inv-summary" class="text-sm text-slate-500">${invSummary()}</p>
        <span class="hidden sm:inline-flex items-center gap-1.5 text-xs text-slate-400">${icon('arrow-up-down')} Nhấn tiêu đề cột để sắp xếp</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm min-w-[900px]">
          <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500 border-b border-slate-200">
            <tr id="inv-head">${invHead()}</tr>

}
const invHead = () => `${sortTh('code', 'Mã')}${sortTh('name', 'Tên vật tư')}${sortTh('category', 'Nhóm')}${sortTh('stock', 'Tồn kho', 'right')}
  <th class="px-4 py-3 text-left font-medium">ĐVT</th>${sortTh('price', 'Đơn giá', 'right')}${sortTh('value', 'Thành tiền', 'right')}<th class="px-4 py-3"></th>`;

function refreshInventoryTable() {
  if (!$('#inv-body')) return;
  $('#inv-body').innerHTML = invRows();

/* ---------- 7.3 PROJECTS & LOGISTICS ---------- */
function projectCard(p) {
  const h = projectHealth(p);
  const done = p.status === 'completed';
  const left = daysFromToday(p.end);
  const statusBadgeHtml = done
    ? `<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium bg-emerald-50 text-emerald-700 ring-1 ring-inset ring-emerald-200">${icon('circle-check')} Hoàn thành</span>`
    : `<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium bg-sky-50 text-sky-700 ring-1 ring-inset ring-sky-200"><span class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></span> Đang thi công</span>`;
  const delayBadge = h.delayed ? `<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium bg-orange-50 text-orange-700 ring-1 ring-inset ring-orange-200">${icon('triangle-alert')} Chậm tiến độ</span>` : '';
  const barColor = done ? 'bg-emerald-500' : h.delayed ? 'bg-orange-500' : 'bg-sky-500';

  return `<article class="bg-white rounded-2xl border border-slate-200/80 shadow-card hover:shadow-lg hover:-translate-y-0.5 transition flex flex-col overflow-hidden">
    <div class="h-1.5 ${done ? 'bg-gradient-to-r from-emerald-400 to-emerald-600' : h.delayed ? 'bg-gradient-to-r from-orange-400 to-rose-500' : 'bg-gradient-to-r from-sky-400 to-slate-700'}"></div>
    <div class="p-5 flex-1">
      <div class="flex items-center justify-between gap-2">
        <span class="font-mono text-xs font-semibold text-slate-400">${esc(p.code)}</span>
        <div class="flex flex-wrap justify-end gap-1.5">${delayBadge}${statusBadgeHtml}</div>
      </div>
      <h3 class="mt-2 font-semibold text-slate-900 leading-snug">${esc(p.name)}</h3>
      <div class="mt-2 space-y-1 text-sm text-slate-500">
        <div class="flex items-center gap-2">${icon('map-pin', 'text-slate-400')} ${esc(p.location)}</div>
        <div class="flex items-center gap-2">${icon('building-2', 'text-slate-400')} <span class="truncate">${esc(p.client)}</span></div>
        <div class="flex items-center gap-2">${icon('user', 'text-slate-400')} ${esc(p.manager)}</div>
      </div>

      <div class="mt-4">
        <div class="flex items-center justify-between text-xs mb-1.5">
          <span class="text-slate-500">Tiến độ thi công ${!done ? `<span class="text-slate-400">· KH ${h.expected}%</span>` : ''}</span>
          <span class="font-semibold text-slate-900 num">${p.progress}%</span>
        </div>
        ${progressBar(p.progress, barColor, 'h-2', done ? null : h.expected)}
        <div class="flex items-center justify-between text-xs text-slate-500 mt-2">
          <span>${icon('calendar', 'inline -mt-0.5')} ${fmtDate(p.start)} → ${fmtDate(p.end)}</span>
          <span class="${!done && left < 0 ? 'text-rose-600 font-medium' : ''}">${done ? 'Đã bàn giao' : left < 0 ? `Trễ ${-left} ngày` : `Còn ${left} ngày`}</span>
        </div>
        ${h.delayed ? `<div class="mt-2 text-xs rounded-lg bg-orange-50 text-orange-700 px-2.5 py-1.5">${esc(h.reason)}</div>` : ''}
      </div>
    </div>

    <div class="px-5 py-4 border-t border-slate-100 bg-slate-50/60">
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Vật tư phân bổ</span>
        <span class="text-xs text-slate-400">${p.alloc.length} mã</span>
      </div>
      <ul class="space-y-2.5">
        ${p.alloc.map(a => {
          const m = matById(a.m); if (!m) return '';
          const pct = a.planned ? Math.round(a.used / a.planned * 100) : 0;
          return `<li>
            <div class="flex items-center justify-between gap-2 text-xs">
              <span class="text-slate-700 truncate">${esc(m.name)}</span>
              <span class="num text-slate-500 whitespace-nowrap"><b class="text-slate-800 font-medium">${fmtNum(a.used)}</b> / ${fmtNum(a.planned)} ${esc(m.unit)}</span>
            </div>
            <div class="mt-1">${progressBar(pct, pct >= 95 ? 'bg-emerald-500' : 'bg-slate-400', 'h-1')}</div>
          </li>`;
        }).join('')}
      </ul>
    </div>

    <div class="px-5 py-3 border-t border-slate-100 flex items-center justify-between gap-2">
      <div class="text-xs text-slate-500">Giá trị HĐ<div class="text-sm font-semibold text-slate-900 num">${fmtCompact(p.contract)} ₫</div></div>
      ${done
        ? `<span class="text-xs text-slate-400 inline-flex items-center gap-1">${icon('lock')} Đã khóa sổ</span>`
        : `<button data-action="allocate" data-id="${p.id}" class="inline-flex items-center gap-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium px-3 py-2 transition">${icon('truck')} Xuất vật tư</button>`}
    </div>
  </article>`;
}

function renderProjects() {
  const all = S().projects;
  const f = ui.projFilter;
  const list = all.filter(p => f === 'all' || (f === 'delayed' ? projectHealth(p).delayed : p.status === f));
  const tabs = [
    ['all', 'Tất cả', all.length],
    ['active', 'Đang thi công', all.filter(p => p.status === 'active').length],
    ['delayed', 'Chậm tiến độ', all.filter(p => projectHealth(p).delayed).length],
    ['completed', 'Hoàn thành', all.filter(p => p.status === 'completed').length]
  ];
  return `
  <div class="space-y-5">
    <div class="flex flex-wrap items-center gap-2">
      ${tabs.map(([k, l, n]) => `<button data-action="proj-filter" data-f="${k}" class="inline-flex items-center gap-2 rounded-full px-3.5 py-1.5 text-sm font-medium transition ${f === k ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:border-slate-300'}">${l}<span class="text-xs rounded-full px-1.5 ${f === k ? 'bg-white/15' : 'bg-slate-100'}">${n}</span></button>`).join('')}
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-5">
      ${list.map(projectCard).join('') || `<div class="col-span-full text-center text-slate-400 py-16">Không có dự án</div>`}
    </div>
  </div>`;
}

/* ---------- 7.4 SUPPLIERS ---------- */
function supplierRows() {

    const paidPct = st.total ? Math.round(st.paid / st.total * 100) : 100;

      <div class="lg:col-span-4 flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-slate-900 text-white grid place-items-center text-sm font-semibold shrink-0">${esc(initials(s.name))}</div>
        <div class="min-w-0">
          <div class="font-medium text-slate-900 truncate">${esc(s.name)}</div>
          <div class="text-xs text-slate-500 flex items-center gap-1 truncate">${icon('map-pin')} ${esc(s.address || '—')}</div>
        </div>
      </div>
      <div class="lg:col-span-2 text-sm">
        <div class="text-slate-800">${esc(s.contact)}</div>
        <a href="tel:${esc(s.phone.replace(/\s/g, ''))}" class="text-xs text-slate-500 hover:text-emerald-700 inline-flex items-center gap-1 num">${icon('phone')} ${esc(s.phone)}</a>
      </div>
      <div class="lg:col-span-2 flex flex-wrap gap-1">${s.types.map(catBadge).join('')}<span class="text-[11px] text-slate-400 w-full mt-0.5">Công nợ ${s.terms} ngày</span></div>
      <div class="lg:col-span-3">
        <div class="flex items-baseline justify-between gap-2">
          <span class="text-xs text-slate-500">Dư nợ hiện tại</span>
          <span class="text-base font-semibold num ${st.debt ? 'text-slate-900' : 'text-emerald-600'}">${st.debt ? fmtVND(st.debt) : 'Đã tất toán'}</span>
        </div>

/* ---------- 7.5 DEBT LEDGER ---------- */
function ledgerList(type) {
  const k = ui.ledger.q.trim().toLowerCase();
  const f = ui.ledger[type];
  const rank = { overdue: 0, soon: 1, open: 2, paid: 3 };
  return (type === 'ap' ? S().payables : S().receivables)
    .map(inv => ({ inv, party: partyOf(type, inv), st: invStatus(inv) }))
    .filter(x => !k || [x.inv.id, x.inv.desc, x.party.name, x.party.sub].join(' ').toLowerCase().includes(k))
    .filter(x => f === 'all' || (f === 'open' ? x.st !== 'paid' : f === 'overdue' ? x.st === 'overdue' : x.st === 'paid'))
    .sort((a, b) => rank[a.st] - rank[b.st] || a.inv.due.localeCompare(b.inv.due));
}

function ledgerTable(type) {
  const isAP = type === 'ap';
  const list = ledgerList(type);
  const all = isAP ? S().payables : S().receivables;
  const f = ui.ledger[type];
  const sum = (arr, fn) => arr.reduce((a, x) => a + fn(x.inv), 0);
  const chips = [['all', 'Tất cả'], ['open', 'Chưa tất toán'], ['overdue', 'Quá hạn'], ['paid', 'Đã tất toán']];
  const totalRemain = all.reduce((a, i) => a + remaining(i), 0);

  return card(`
    <div class="px-5 py-4 border-b border-slate-100 flex flex-col md:flex-row md:items-center gap-3 justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl grid place-items-center ${isAP ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}">${icon(isAP ? 'arrow-up-right' : 'arrow-down-left', '!w-5 !h-5')}</div>
        <div>
          <h2 class="font-semibold text-slate-900">${isAP ? 'Phải trả Nhà cung cấp' : 'Phải thu Khách hàng'}</h2>
          <p class="text-xs text-slate-500">${isAP ? 'Accounts Payable' : 'Accounts Receivable'} · ${all.length} hóa đơn · còn lại <b class="num ${isAP ? 'text-rose-600' : 'text-emerald-700'}">${fmtVND(totalRemain)}</b></p>
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5">
        ${chips.map(([k, l]) => `<button data-action="ledger-filter" data-type="${type}" data-f="${k}" class="rounded-full px-3 py-1 text-xs font-medium transition ${f === k ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm min-w-[980px]">
        <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500 border-b border-slate-200">
          <tr>
            <th class="px-4 py-3 text-left font-medium">Hóa đơn / Nội dung</th>
            <th class="px-4 py-3 text-left font-medium">${isAP ? 'Nhà cung cấp' : 'Khách hàng / Dự án'}</th>
            <th class="px-4 py-3 text-right font-medium">Tổng hóa đơn</th>
            <th class="px-4 py-3 text-right font-medium">Đã thanh toán</th>
            <th class="px-4 py-3 text-right font-medium">Còn lại</th>
            <th class="px-4 py-3 text-left font-medium">Hạn thanh toán</th>
            <th class="px-4 py-3 text-right font-medium"></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          ${list.length ? list.map(({ inv, party, st }) => {
            const rem = remaining(inv), pct = Math.round(inv.paid / inv.total * 100);
            return `<tr class="hover:bg-slate-50/80 ${st === 'overdue' ? 'bg-rose-50/30' : ''}">
              <td class="px-4 py-3 min-w-[220px]">
                <div class="font-mono text-xs font-semibold text-slate-500">${esc(inv.id)}</div>
                <div class="text-slate-800">${esc(inv.desc)}</div>
              </td>
              <td class="px-4 py-3 min-w-[200px]">
                <div class="font-medium text-slate-800 truncate max-w-[240px]">${esc(party.name)}</div>
                <div class="text-xs text-slate-500 truncate max-w-[240px]">${esc(party.sub)}</div>
              </td>
              <td class="px-4 py-3 text-right num whitespace-nowrap text-slate-700">${fmtVND(inv.total)}</td>
              <td class="px-4 py-3 text-right num whitespace-nowrap">
                <div class="text-slate-700">${fmtVND(inv.paid)}</div>
                <div class="w-20 ml-auto mt-1">${progressBar(pct, 'bg-emerald-500', 'h-1')}</div>
              </td>
              <td class="px-4 py-3 text-right num whitespace-nowrap font-semibold ${rem ? (isAP ? 'text-rose-600' : 'text-slate-900') : 'text-emerald-600'}">${fmtVND(rem)}</td>
              <td class="px-4 py-3 whitespace-nowrap">
                <div class="text-slate-700 num">${fmtDate(inv.due)}</div>
                <div class="mt-0.5">${statusBadge(inv)}</div>
              </td>
              <td class="px-4 py-3 text-right whitespace-nowrap">
                <button data-action="pay" data-type="${type}" data-id="${esc(inv.id)}" class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium transition ${rem ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'border border-slate-200 text-slate-600 hover:bg-slate-100'}">
                  ${icon(rem ? 'banknote' : 'history')} ${rem ? 'Cập nhật TT' : 'Lịch sử'}
                </button>
              </td>
            </tr>`;
          }).join('') : `<tr><td colspan="7" class="px-6 py-12 text-center text-sm text-slate-400">Không có hóa đơn phù hợp</td></tr>`}
        </tbody>
        ${list.length ? `<tfoot class="bg-slate-50 border-t border-slate-200 text-sm">
          <tr>
            <td class="px-4 py-3 font-semibold text-slate-700" colspan="2">Cộng (${list.length} HĐ đang hiển thị)</td>
            <td class="px-4 py-3 text-right num font-semibold text-slate-800">${fmtVND(sum(list, i => i.total))}</td>
            <td class="px-4 py-3 text-right num font-semibold text-slate-800">${fmtVND(sum(list, i => i.paid))}</td>
            <td class="px-4 py-3 text-right num font-semibold ${isAP ? 'text-rose-600' : 'text-emerald-700'}">${fmtVND(sum(list, remaining))}</td>
            <td colspan="2"></td>
          </tr>
        </tfoot>` : ''}
      </table>
    </div>
  `);
}

function renderLedger() {
  const ap = S().payables.reduce((a, i) => a + remaining(i), 0);
  const ar = S().receivables.reduce((a, i) => a + remaining(i), 0);
  const net = ar - ap;
  const stat = (label, value, cls, ic, bg) => `<div class="bg-white rounded-2xl border border-slate-200/80 shadow-card px-5 py-4 flex items-center gap-4">
    <div class="w-10 h-10 rounded-xl grid place-items-center ${bg}">${icon(ic, '!w-5 !h-5')}</div>
    <div><div class="text-xs text-slate-500">${label}</div><div class="text-lg font-semibold num ${cls}">${value}</div></div></div>`;
  return `
  <div class="space-y-5">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      ${stat('Tổng phải trả (còn lại)', fmtVND(ap), 'text-rose-600', 'arrow-up-right', 'bg-rose-50 text-rose-600')}
      ${stat('Tổng phải thu (còn lại)', fmtVND(ar), 'text-emerald-700', 'arrow-down-left', 'bg-emerald-50 text-emerald-600')}
      ${stat('Vị thế ròng (Thu − Trả)', (net >= 0 ? '+' : '') + fmtVND(net), net >= 0 ? 'text-slate-900' : 'text-rose-600', 'scale', 'bg-slate-900 text-white')}
    </div>
    <div class="relative max-w-md">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">${icon('search', '!w-4 !h-4')}</span>
      <input id="ledger-search" type="search" value="${esc(ui.ledger.q)}" placeholder="Tìm số hóa đơn, đối tác, nội dung…" class="${inputCls} pl-9">
    </div>
    <div id="ledger-ap">${ledgerTable('ap')}</div>
    <div id="ledger-ar">${ledgerTable('ar')}</div>
  </div>`;
}
function refreshLedger() {
  if (!$('#ledger-ap')) return;
  $('#ledger-ap').innerHTML = ledgerTable('ap');
  $('#ledger-ar').innerHTML = ledgerTable('ar');
  refreshIcons();
}

/* ============ 8. MODALS ============ */

/* ---- 8.1 Add / Edit Material ---- */
function openMaterialModal(id) {
  const isEdit = !!id;
  const m = isEdit ? matById(id) : { code: '', name: '', category: ui.inv.cat !== 'all' ? ui.inv.cat : '', unit: '', stock: '', minStock: '', price: '', supplierId: '' };
  if (!m) return;
  openModal(`
    <form id="mat-form" novalidate class="flex flex-col min-h-0">
      ${modalHeader(isEdit ? 'Cập nhật vật tư' : 'Thêm vật tư mới', isEdit ? esc(m.code + ' · ' + m.name) : 'Khai báo mã vật tư mới vào kho', 'package')}
      <div class="px-6 py-5 overflow-y-auto space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          ${field('code', 'Mã vật tư <span class="text-rose-500">*</span>', `<input id="f-code" name="code" class="${inputCls} font-mono uppercase" value="${esc(m.code)}" placeholder="VD: XM-003" autocomplete="off" maxlength="15">`)}
          <div class="sm:col-span-2">${field('name', 'Tên vật tư <span class="text-rose-500">*</span>', `<input id="f-name" name="name" class="${inputCls}" value="${esc(m.name)}" placeholder="VD: Xi măng INSEE PCB40">`)}</div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          ${field('category', 'Nhóm vật tư <span class="text-rose-500">*</span>', `<select id="f-category" name="category" class="${inputCls}"><option value="">— Chọn nhóm —</option>${Object.keys(CATEGORIES).map(c => `<option ${m.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select>`)}
          ${field('unit', 'Đơn vị tính <span class="text-rose-500">*</span>', `<select id="f-unit" name="unit" class="${inputCls}"><option value="">— Chọn ĐVT —</option>${UNITS.map(u => `<option ${m.unit === u ? 'selected' : ''}>${u}</option>`).join('')}</select>`)}
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          ${field('stock', 'Tồn kho hiện tại <span class="text-rose-500">*</span>', `<input id="f-stock" name="stock" type="number" step="any" min="0" inputmode="decimal" class="${inputCls} num" value="${m.stock}">`)}
          ${field('minStock', 'Ngưỡng an toàn <span class="text-rose-500">*</span>', `<input id="f-minStock" name="minStock" type="number" step="any" min="0" inputmode="decimal" class="${inputCls} num" value="${m.minStock}">`, 'Cảnh báo khi tồn kho thấp hơn')}
          ${field('price', 'Đơn giá (₫) <span class="text-rose-500">*</span>', `<input id="f-price" name="price" type="number" step="1" min="0" inputmode="numeric" class="${inputCls} num" value="${m.price}">`)}
        </div>
        ${field('supplierId', 'Nhà cung cấp chính', `<select id="f-supplierId" name="supplierId" class="${inputCls}"><option value="">— Không chỉ định —</option>${S().suppliers.map(s => `<option value="${s.id}" ${m.supplierId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`)}
        <div id="mat-preview" class="rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 grid grid-cols-2 gap-3 text-sm"></div>
      </div>
      ${modalFooter(`
        ${isEdit ? `<button type="button" data-action="material-delete" data-id="${m.id}" class="inline-flex items-center gap-1.5 text-sm text-rose-600 hover:text-rose-700 font-medium">${icon('trash-2', '!w-4 !h-4')} Xóa</button>` : ''}
        <div class="flex-1"></div>
        <button type="button" class="${btnGhost}" data-action="close-modal">Hủy</button>
        <button type="submit" class="${btnPrimary}">${icon('check', '!w-4 !h-4')} ${isEdit ? 'Lưu thay đổi' : 'Thêm vật tư'}</button>`)}
    </form>`, 'max-w-2xl');

  const form = $('#mat-form');
  const numRule = (label, allowZero = true) => v => v === '' || isNaN(v) ? `Nhập ${label}` : (+v < 0 || (!allowZero && +v === 0)) ? `${label[0].toUpperCase() + label.slice(1)} phải ${allowZero ? '≥ 0' : '> 0'}` : null;
  const rules = {
    code: v => {
      v = v.toUpperCase();
      if (!v) return 'Bắt buộc nhập mã vật tư';
      if (!/^[A-Z0-9-]{3,15}$/.test(v)) return 'Chỉ gồm chữ không dấu, số và "-" (3–15 ký tự)';
      if (S().materials.some(x => x.code === v && x.id !== id)) return 'Mã vật tư đã tồn tại';
      return null;
    },
    name: v => v.length < 3 ? 'Tên vật tư tối thiểu 3 ký tự' : v.length > 80 ? 'Tối đa 80 ký tự' : null,
    category: v => !v ? 'Vui lòng chọn nhóm' : null,
    unit: v => !v ? 'Vui lòng chọn đơn vị tính' : null,
    stock: numRule('số lượng tồn'),
    minStock: numRule('ngưỡng an toàn'),
    price: numRule('đơn giá', false)
  };
  const preview = () => {
    const st = +form.elements.stock.value || 0, pr = +form.elements.price.value || 0, mn = +form.elements.minStock.value || 0;
    const lv = st <= 0 ? ['Hết hàng', 'text-rose-600'] : st < mn ? ['Dưới ngưỡng an toàn', 'text-amber-600'] : ['An toàn', 'text-emerald-600'];
    $('#mat-preview').innerHTML = `
      <div><div class="text-xs text-slate-500">Giá trị tồn kho</div><div class="font-semibold text-slate-900 num">${fmtVND(st * pr)}</div></div>
      <div><div class="text-xs text-slate-500">Trạng thái</div><div class="font-semibold ${lv[1]}">${lv[0]}</div></div>`;
  };
  const validateAll = bindValidation(form, rules, preview);
  preview();

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!validateAll()) { toast('Vui lòng kiểm tra lại các trường được đánh dấu', 'error'); return; }
    const fd = Object.fromEntries(new FormData(form));
    await API.saveMaterial({
      id: id || null, code: fd.code.trim().toUpperCase(), name: fd.name.trim(), category: fd.category, unit: fd.unit,
      stock: round3(+fd.stock), minStock: round3(+fd.minStock), price: Math.round(+fd.price), supplierId: fd.supplierId
    });
    closeModal();
    toast(isEdit ? 'Đã cập nhật vật tư' : 'Đã thêm vật tư mới vào kho');
    navigate(currentView, { keepScroll: true });
  });
}

function confirmDeleteMaterial(id) {
  const m = matById(id); if (!m) return;
  const used = S().projects.filter(p => p.status !== 'completed' && p.alloc.some(a => a.m === id));
  if (used.length) { toast(`Không thể xóa: "${m.name}" đang phân bổ cho ${used.length} dự án đang thi công`, 'error'); return; }
  confirmDialog({
    title: 'Xóa vật tư?', danger: true, confirmText: 'Xóa vật tư',
    message: `Bạn có chắc muốn xóa <b class="text-slate-900">${esc(m.code)} – ${esc(m.name)}</b> khỏi danh mục kho? Giá trị tồn hiện tại: <b class="num">${fmtVND(matValue(m))}</b>.`,
    onConfirm: async () => { await API.deleteMaterial(id); toast('Đã xóa vật tư'); navigate(currentView, { keepScroll: true }); }
  });
}

/* ---- 8.2 Update Payment (with log) ---- */
function openPaymentModal(type, id) {
  const isAP = type === 'ap';
  const inv = (isAP ? S().payables : S().receivables).find(x => x.id === id);
  if (!inv) return;
  const party = partyOf(type, inv);
  const rem = remaining(inv);
  const pct = Math.round(inv.paid / inv.total * 100);
  const history = [...inv.payments].sort((a, b) => b.date.localeCompare(a.date));

  openModal(`
    <form id="pay-form" novalidate class="flex flex-col min-h-0">
      ${modalHeader(isAP ? 'Thanh toán cho nhà cung cấp' : 'Ghi nhận khách hàng thanh toán', `${esc(inv.id)} · ${esc(party.name)}`, isAP ? 'arrow-up-right' : 'arrow-down-left', isAP ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600')}
      <div class="overflow-y-auto">
        <div class="px-6 py-5 space-y-4">
          <div class="text-sm text-slate-600">${esc(inv.desc)}${party.sub ? ` <span class="text-slate-400">· ${esc(party.sub)}</span>` : ''}</div>
          <div class="grid grid-cols-3 gap-3">
            ${[['Tổng hóa đơn', fmtVND(inv.total), 'text-slate-900'], ['Đã thanh toán', fmtVND(inv.paid), 'text-emerald-700'], ['Còn lại', fmtVND(rem), rem ? 'text-rose-600' : 'text-emerald-600']]
              .map(([l, v, c]) => `<div class="rounded-xl bg-slate-50 border border-slate-200 px-3 py-2.5"><div class="text-[11px] text-slate-500">${l}</div><div class="text-sm font-semibold num ${c}">${v}</div></div>`).join('')}
          </div>
          <div>
            <div class="flex justify-between text-xs text-slate-500 mb-1"><span>Tiến độ thanh toán</span><span>${pct}% · hạn ${fmtDate(inv.due)}</span></div>
            ${progressBar(pct, 'bg-emerald-500', 'h-2')}
          </div>

          ${rem > 0 ? `
          <div class="rounded-xl border border-slate-200 p-4 space-y-4">
            <div class="text-sm font-semibold text-slate-800">Ghi nhận khoản thanh toán mới</div>
            ${field('amount', 'Số tiền (₫) <span class="text-rose-500">*</span>', `
              <input id="f-amount" name="amount" type="number" step="1" min="1" inputmode="numeric" class="${inputCls} num text-base" placeholder="0">
              <div class="flex flex-wrap gap-1.5 mt-2">
                ${[25, 50, 100].map(p => `<button type="button" data-action="pay-quick" data-pct="${p}" data-rem="${rem}" class="rounded-md bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-xs font-medium text-slate-600 px-2.5 py-1 transition">${p === 100 ? 'Toàn bộ' : p + '%'}</button>`).join('')}
              </div>`, `<span id="amount-hint">Tối đa ${fmtVND(rem)}</span>`)}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              ${field('date', 'Ngày thanh toán <span class="text-rose-500">*</span>', `<input id="f-date" name="date" type="date" class="${inputCls}" value="${todayISO()}" max="${todayISO()}">`)}
              ${field('method', 'Hình thức <span class="text-rose-500">*</span>', `<select id="f-method" name="method" class="${inputCls}">${PAY_METHODS.map(m => `<option>${m}</option>`).join('')}</select>`)}
            </div>
            ${field('note', 'Ghi chú / Số chứng từ', `<input id="f-note" name="note" class="${inputCls}" placeholder="VD: UNC số 0457 – Vietcombank" maxlength="120">`)}
          </div>` : `
          <div class="rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm px-4 py-3 flex items-center gap-2">${icon('circle-check', '!w-4 !h-4')} Hóa đơn đã được tất toán đầy đủ.</div>`}
        </div>

        <div class="px-6 pb-5">
          <div class="flex items-center gap-2 text-sm font-semibold text-slate-800 mb-3">${icon('history', '!w-4 !h-4 text-slate-400')} Nhật ký thanh toán <span class="text-xs font-normal text-slate-400">(${history.length})</span></div>
          ${history.length ? `<ol class="relative border-l border-slate-200 ml-2 space-y-3">
            ${history.map(p => `<li class="ml-4">
              <span class="absolute -left-[5px] mt-1.5 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-white"></span>
              <div class="flex items-center justify-between gap-3">
                <span class="text-sm font-semibold num text-slate-900">${fmtVND(p.amount)}</span>
                <span class="text-xs text-slate-500 num">${fmtDate(p.date)}</span>
              </div>
              <div class="text-xs text-slate-500">${esc(p.method)}${p.note ? ' · ' + esc(p.note) : ''}</div>
            </li>`).join('')}
          </ol>` : `<div class="text-sm text-slate-400 bg-slate-50 rounded-xl px-4 py-3">Chưa có khoản thanh toán nào</div>`}
        </div>
      </div>
      ${modalFooter(`<div class="flex-1"></div>
        <button type="button" class="${btnGhost}" data-action="close-modal">${rem > 0 ? 'Hủy' : 'Đóng'}</button>
        ${rem > 0 ? `<button type="submit" class="${btnPrimary}">${icon('check', '!w-4 !h-4')} Xác nhận thanh toán</button>` : ''}`)}
    </form>`, 'max-w-xl');

  if (rem <= 0) return;
  const form = $('#pay-form');
  const rules = {
    amount: v => v === '' || isNaN(v) || +v <= 0 ? 'Nhập số tiền lớn hơn 0' : !Number.isInteger(+v) ? 'Số tiền phải là số nguyên (đồng)' : +v > rem ? `Vượt số còn lại (${fmtVND(rem)})` : null,
    date: v => !v ? 'Chọn ngày thanh toán' : v > todayISO() ? 'Không được chọn ngày tương lai' : v < inv.issued ? 'Trước ngày xuất hóa đơn' : null,
    method: v => !v ? 'Chọn hình thức' : null
  };
  const hint = () => {
    const a = +form.elements.amount.value || 0;
    $('#amount-hint').innerHTML = a > 0 && a <= rem
      ? `= <b class="text-slate-700">${fmtVND(a)}</b> · còn lại sau thanh toán: <b class="${rem - a ? 'text-slate-700' : 'text-emerald-600'}">${fmtVND(rem - a)}</b>`
      : `Tối đa ${fmtVND(rem)}`;
  };
  const validateAll = bindValidation(form, rules, hint);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!validateAll()) return;
    const fd = Object.fromEntries(new FormData(form));
    try {
      await API.recordPayment(type, id, { amount: +fd.amount, date: fd.date, method: fd.method, note: fd.note.trim() });
      closeModal();
      toast(`Đã ghi nhận ${fmtVND(+fd.amount)} cho ${inv.id}`);
      navigate(currentView, { keepScroll: true });
    } catch (err) { toast(err.message, 'error'); }
  });
}

/* ---- 8.3 Allocate materials to project (Xuất kho) ---- */
function openAllocateModal(pid) {
  const p = prjById(pid); if (!p) return;
  const mats = [...S().materials].sort((a, b) => a.category.localeCompare(b.category, 'vi') || a.name.localeCompare(b.name, 'vi'));
  openModal(`
    <form id="alloc-form" novalidate class="flex flex-col min-h-0">
      ${modalHeader('Xuất vật tư cho công trình', esc(p.code + ' · ' + p.name), 'truck', 'bg-slate-900 text-white')}
      <div class="px-6 py-5 overflow-y-auto space-y-4">
        ${field('mat', 'Vật tư <span class="text-rose-500">*</span>', `<select id="f-mat" name="mat" class="${inputCls}"><option value="">— Chọn vật tư —</option>
          ${Object.keys(CATEGORIES).map(c => `<optgroup label="${c}">${mats.filter(m => m.category === c).map(m => `<option value="${m.id}" ${m.stock <= 0 ? 'disabled' : ''}>${esc(m.name)} — tồn ${fmtNum(m.stock)} ${esc(m.unit)}</option>`).join('')}</optgroup>`).join('')}</select>`)}
        ${field('qty', 'Số lượng xuất <span class="text-rose-500">*</span>', `<input id="f-qty" name="qty" type="number" step="any" min="0" inputmode="decimal" class="${inputCls} num" placeholder="0">`, '<span id="qty-hint">Chọn vật tư để xem tồn kho khả dụng</span>')}
        ${field('note', 'Ghi chú (số phiếu xuất, xe vận chuyển…)', `<input id="f-note" name="note" class="${inputCls}" placeholder="VD: PXK-0923 · Xe 51D-123.45" maxlength="120">`)}
        <div class="rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 text-xs text-slate-500 flex gap-2">${icon('info', '!w-4 !h-4 text-slate-400 mt-0.5')} Số lượng xuất sẽ được trừ trực tiếp khỏi tồn kho và cộng vào khối lượng đã sử dụng của dự án.</div>
      </div>
      ${modalFooter(`<div class="flex-1"></div>
        <button type="button" class="${btnGhost}" data-action="close-modal">Hủy</button>
        <button type="submit" class="${btnPrimary}">${icon('check', '!w-4 !h-4')} Xác nhận xuất kho</button>`)}
    </form>`, 'max-w-lg');

  const form = $('#alloc-form');
  const selMat = () => matById(form.elements.mat.value);
  const rules = {
    mat: v => !v ? 'Chọn vật tư cần xuất' : null,
    qty: v => {
      const m = selMat();
      if (v === '' || isNaN(v) || +v <= 0) return 'Nhập số lượng lớn hơn 0';
      if (m && +v > m.stock) return `Vượt tồn kho (${fmtNum(m.stock)} ${m.unit})`;
      return null;
    }
  };
  const onChange = (name, check) => {
    const m = selMat();
    const q = +form.elements.qty.value || 0;
    $('#qty-hint').innerHTML = m
      ? `Khả dụng: <b class="text-slate-700 num">${fmtNum(m.stock)} ${esc(m.unit)}</b>${q > 0 && q <= m.stock ? ` · tồn sau xuất: <b class="${m.stock - q < m.minStock ? 'text-amber-600' : 'text-slate-700'} num">${fmtNum(round3(m.stock - q))}</b>${m.stock - q < m.minStock ? ' (dưới ngưỡng)' : ''} · giá trị ${fmtVND(q * m.price)}` : ''}`
      : 'Chọn vật tư để xem tồn kho khả dụng';
    if (name === 'mat' && form.elements.qty.value !== '') check('qty');
  };
  const validateAll = bindValidation(form, rules, onChange);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!validateAll()) return;
    const m = selMat(), qty = round3(+form.elements.qty.value);
    try {
      await API.allocateMaterial(pid, m.id, qty, form.elements.note.value.trim());
      closeModal();
      toast(`Đã xuất ${fmtNum(qty)} ${m.unit} ${m.name}`);
      navigate(currentView, { keepScroll: true });
    } catch (err) { toast(err.message, 'error'); }
  });
}

/* ---- 8.4 Add Supplier ---- */
function openSupplierModal() {
  openModal(`
    <form id="sup-form" novalidate class="flex flex-col min-h-0">
      ${modalHeader('Thêm nhà cung cấp', 'Hồ sơ đối tác cung ứng vật tư', 'factory')}
      <div class="px-6 py-5 overflow-y-auto space-y-4">
        ${field('name', 'Tên công ty <span class="text-rose-500">*</span>', `<input id="f-name" name="name" class="${inputCls}" placeholder="VD: Công ty TNHH VLXD Hưng Thịnh">`)}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          ${field('contact', 'Người liên hệ <span class="text-rose-500">*</span>', `<input id="f-contact" name="contact" class="${inputCls}" placeholder="Họ và tên">`)}
          ${field('phone', 'Số điện thoại <span class="text-rose-500">*</span>', `<input id="f-phone" name="phone" type="tel" class="${inputCls} num" placeholder="09xx xxx xxx">`)}
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          ${field('type', 'Nhóm hàng chính <span class="text-rose-500">*</span>', `<select id="f-type" name="type" class="${inputCls}"><option value="">— Chọn nhóm —</option>${Object.keys(CATEGORIES).map(c => `<option>${c}</option>`).join('')}</select>`)}
          ${field('terms', 'Thời hạn công nợ (ngày) <span class="text-rose-500">*</span>', `<input id="f-terms" name="terms" type="number" min="0" max="180" class="${inputCls} num" value="30">`)}
        </div>
        ${field('address', 'Địa chỉ', `<input id="f-address" name="address" class="${inputCls}" placeholder="Quận/huyện, Tỉnh/thành">`)}
      </div>
      ${modalFooter(`<div class="flex-1"></div>
        <button type="button" class="${btnGhost}" data-action="close-modal">Hủy</button>
        <button type="submit" class="${btnPrimary}">${icon('check', '!w-4 !h-4')} Lưu nhà cung cấp</button>`)}
    </form>`, 'max-w-xl');
  const form = $('#sup-form');
  const rules = {
    name: v => v.length < 5 ? 'Tên công ty tối thiểu 5 ký tự' : S().suppliers.some(s => s.name.toLowerCase() === v.toLowerCase()) ? 'Nhà cung cấp đã tồn tại' : null,
    contact: v => v.length < 2 ? 'Nhập tên người liên hệ' : null,
    phone: v => !/^0\d{9,10}$/.test(v.replace(/[\s.-]/g, '')) ? 'SĐT không hợp lệ (10–11 số, bắt đầu bằng 0)' : null,
    type: v => !v ? 'Chọn nhóm hàng' : null,
    terms: v => v === '' || isNaN(v) || +v < 0 || +v > 180 ? 'Từ 0 đến 180 ngày' : null
  };
  const validateAll = bindValidation(form, rules);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!validateAll()) return;
    const fd = Object.fromEntries(new FormData(form));
    await API.saveSupplier({ name: fd.name.trim(), contact: fd.contact.trim(), phone: fd.phone.trim(), types: [fd.type], terms: +fd.terms, address: fd.address.trim() });
    closeModal();
    toast('Đã thêm nhà cung cấp');
    navigate(currentView, { keepScroll: true });
  });
}

/* ============ 9. ROUTER & EVENTS ============ */
const VIEWS = {
  dashboard: { title: 'Tổng quan', sub: 'Bức tranh tài chính & vận hành theo thời gian thực', icon: 'layout-dashboard', en: 'Overview', render: renderDashboard },
  inventory: { title: 'Kho vật tư', sub: 'Danh mục, tồn kho và giá trị vật tư xây dựng', icon: 'boxes', en: 'Inventory', render: renderInventory },
  projects:  { title: 'Dự án & Điều phối', sub: 'Tiến độ công trình và vật tư phân bổ theo công trường', icon: 'hard-hat', en: 'Projects & Logistics', render: renderProjects },
  suppliers: { title: 'Nhà cung cấp', sub: 'Hồ sơ đối tác và dư nợ phải trả hiện tại', icon: 'truck', en: 'Suppliers', render: renderSuppliers },
  ledger:    { title: 'Sổ công nợ', sub: 'Phải trả nhà cung cấp · Phải thu khách hàng', icon: 'wallet', en: 'Debt Ledger', render: renderLedger }
};
let currentView = 'dashboard';

function renderNav() {
  const A = getAlerts();
  const badges = { inventory: A.lowStock.length, ledger: A.overdue.length, projects: A.delays.length };
  $('#nav').innerHTML = `<div class="px-3 pb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Điều hướng</div>` +
    Object.entries(VIEWS).map(([k, v]) => {
      const active = k === currentView;
      return `<button data-action="nav" data-view="${k}" class="w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition group
        ${active ? 'bg-emerald-500/10 text-white ring-1 ring-inset ring-emerald-400/20' : 'text-slate-400 hover:text-white hover:bg-white/5'}">
        <span class="${active ? 'text-emerald-400' : 'text-slate-500 group-hover:text-slate-300'}">${icon(v.icon, '!w-[18px] !h-[18px]')}</span>
        <span class="flex-1 text-left leading-tight"><span class="block font-medium">${v.title}</span><span class="block text-[11px] ${active ? 'text-emerald-300/70' : 'text-slate-500'}">${v.en}</span></span>
        ${badges[k] ? `<span class="min-w-[20px] h-5 px-1.5 rounded-full text-[11px] font-semibold grid place-items-center ${k === 'inventory' ? 'bg-amber-500/20 text-amber-300' : k === 'projects' ? 'bg-orange-500/20 text-orange-300' : 'bg-rose-500/20 text-rose-300'}">${badges[k]}</span>` : ''}
      </button>`;
    }).join('');
  const b = $('#bell-badge');
  b.textContent = A.total; b.classList.toggle('hidden', !A.total);
}

function navigate(view, { keepScroll = false } = {}) {
  if (!VIEWS[view]) view = 'dashboard';
  const changed = view !== currentView;
  currentView = view;
  const main = $('#view');
  const y = window.scrollY;
  main.classList.remove('view-enter');
  main.innerHTML = VIEWS[view].render();
  if (!keepScroll || changed) { void main.offsetWidth; main.classList.add('view-enter'); }
  $('#page-title').textContent = VIEWS[view].title;
  $('#page-sub').textContent = VIEWS[view].sub;
  document.title = `${VIEWS[view].title} · BuildLedger`;
  renderNav();
  refreshIcons();
  if (keepScroll && !changed) window.scrollTo(0, y); else window.scrollTo(0, 0);
  if (history.replaceState) history.replaceState(null, '', '#' + view);
  toggleSidebar(false);
}

function toggleSidebar(force) {
  const sb = $('#sidebar'), ov = $('#sidebar-overlay');
  const open = typeof force === 'boolean' ? force : sb.classList.contains('-translate-x-full');
  sb.classList.toggle('-translate-x-full', !open);
  ov.classList.toggle('hidden', !open);
}

// ---- Click delegation ----
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const d = t.dataset;
  switch (d.action) {
    case 'nav': navigate(d.view); break;
    case 'toggle-sidebar': toggleSidebar(); break;
    case 'close-modal': closeModal(); break;
    case 'material-new': openMaterialModal(); break;
    case 'material-edit': openMaterialModal(d.id); break;
    case 'material-delete': closeModal(); setTimeout(() => confirmDeleteMaterial(d.id), $('#modal-root').innerHTML ? 220 : 0); break;
    case 'sort':
      if (ui.inv.sort === d.key) ui.inv.dir *= -1; else { ui.inv.sort = d.key; ui.inv.dir = 1; }
      refreshInventoryTable(); break;
    case 'goto-inv-low': Object.assign(ui.inv, { level: 'low', cat: 'all', q: '' }); navigate('inventory'); break;
    case 'proj-filter': ui.projFilter = d.f; navigate('projects', { keepScroll: true }); break;
    case 'allocate': openAllocateModal(d.id); break;
    case 'supplier-new': openSupplierModal(); break;
    case 'supplier-ledger': Object.assign(ui.ledger, { q: d.name, ap: 'all' }); navigate('ledger'); break;
    case 'ledger-filter': ui.ledger[d.type] = d.f; refreshLedger(); break;
    case 'pay': openPaymentModal(d.type, d.id); break;
    case 'pay-quick': {
      const input = $('#f-amount');
      input.value = Math.round(+d.rem * +d.pct / 100);
      input.dispatchEvent(new Event('input', { bubbles: true }));
      break;
    }
    case 'reset-data':
      confirmDialog({
        title: 'Khôi phục dữ liệu mẫu?', danger: true, confirmText: 'Khôi phục',
        message: 'Toàn bộ thay đổi (vật tư, thanh toán, xuất kho, nhà cung cấp) sẽ bị xóa và thay bằng dữ liệu mẫu ban đầu.',
        onConfirm: () => { Store.reset(); toast('Đã khôi phục dữ liệu mẫu', 'info'); navigate(currentView); }
      });
      break;
  }
});

// ---- Live search / filter inputs ----
document.addEventListener('input', e => {
  switch (e.target.id) {
    case 'inv-search': ui.inv.q = e.target.value; refreshInventoryTable(); break;
    case 'sup-search': ui.sup.q = e.target.value; $('#sup-list').innerHTML = supplierRows(); refreshIcons(); break;
    case 'ledger-search': ui.ledger.q = e.target.value; refreshLedger(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'inv-cat') { ui.inv.cat = e.target.value; refreshInventoryTable(); }
  if (e.target.id === 'inv-level') { ui.inv.level = e.target.value; refreshInventoryTable(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); toggleSidebar(false); } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== currentView) navigate(v); });

// ---- Boot ----
(async function init() {
  Store.load();
  await API.fetchAll(); // TODO(API): thay bằng tải dữ liệu từ server, hiển thị skeleton khi chờ
  $('#today-label').innerHTML = `${icon('calendar', '!w-4 !h-4')} ${new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' })}`;
  const start = location.hash.slice(1);
  navigate(VIEWS[start] ? start : 'dashboard');
})();
</script>
