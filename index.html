<script>
/* =====================================================================
 *  BuildLedger v2 — Quản lý Vật tư & Công nợ Công trình
 *  ---------------------------------------------------------------
 *  1. Utilities            5. API layer (điểm tích hợp backend)
 *  2. Constants            6. Selectors (dữ liệu dẫn xuất)
 *  3. Store (real / demo)  7. UI primitives   8. Views   9. Modals
 *  4. Inventory engine     10. Excel & sao lưu  11. Router & events
 *
 *  Nguyên tắc dữ liệu:
 *  - Dữ liệu THẬT lưu trong localStorage (key buildledger.data.v2).
 *  - Dữ liệu MẪU (demo) chỉ nằm trong bộ nhớ, KHÔNG bao giờ được lưu
 *    hay trộn vào dữ liệu thật.
 *  - Tồn kho & đơn giá bình quân KHÔNG lưu cứng mà được tính lại từ
 *    tồn đầu kỳ + toàn bộ phiếu nhập/xuất/trả → sửa/xóa phiếu luôn đúng.
 *  - Mọi thay đổi chạy qua Store.commit() như một transaction: nếu dữ
 *    liệu sau thay đổi không hợp lệ (tồn âm, trả quá số đã TT…) thì
 *    thay đổi bị hủy và báo lỗi.
 * ===================================================================== */

/* ============ 1. UTILITIES ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf3 = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 3 });
const nf0 = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 });
const fmtNum = n => nf3.format(+n || 0);
const fmtVND = n => nf0.format(Math.round(+n || 0)) + ' ₫';
const fmtCompact = n => {
  n = +n || 0; const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + ' tỷ';
  if (a >= 1e6) return (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' tr';
  return nf0.format(Math.round(n));
};
const isoOf = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const todayISO = () => isoOf(new Date());
const addDays = (n, from) => { const d = from ? new Date(from + 'T00:00:00') : new Date(); d.setDate(d.getDate() + n); return isoOf(d); };
const fmtDate = s => s ? s.split('-').reverse().join('/') : '—';
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const daysFromToday = s => dayDiff(todayISO(), s);
const uid = p => p + Date.now().toString(36).slice(-6) + Math.random().toString(36).slice(2, 6);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const round3 = n => Math.round((+n || 0) * 1000) / 1000;
const sum = (arr, fn = x => x) => arr.reduce((a, x) => a + (+fn(x) || 0), 0);
const noAccent = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
const initials = s => noAccent(String(s).replace(/^(Công ty|Cty|CP|TNHH|NPP|Đại lý|Nhà máy|Ban QLDA|Ông|Bà|Anh|Chị)\s+/gi, ''))
  .split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
/** Số chứng từ tiếp theo: nextNo('PN', ['PN-0003','PN-0010']) → 'PN-0011' */
function nextNo(prefix, list) {
  const re = new RegExp('^' + prefix.replace(/[-]/g, '\\-') + '-(\\d+)$');
  const max = Math.max(0, ...list.map(x => { const m = re.exec(String(x || '')); return m ? +m[1] : 0; }));
  return `${prefix}-${String(max + 1).padStart(4, '0')}`;
}

/* ============ 2. CONSTANTS ============ */
const DEFAULT_CATEGORIES = ['Xi măng', 'Cát', 'Đá', 'Gạch', 'Thép', 'Sơn', 'Điện nước', 'Gỗ – Cốp pha', 'Phụ gia – Hóa chất', 'Khác'];
const DEFAULT_UNITS = ['Bao', 'm³', 'm²', 'm', 'Tấn', 'Kg', 'Viên', 'Thùng', 'Cây', 'Cuộn', 'Tấm', 'Bộ', 'Cái', 'Lít'];
const VAT_RATES = [0, 5, 8, 10];
const PAY_METHODS = ['Chuyển khoản', 'Ủy nhiệm chi', 'Tiền mặt', 'Bù trừ công nợ'];
const MV_TYPES = {
  in:     { label: 'Nhập kho',    prefix: 'PN', icon: 'package-plus',  cls: 'bg-emerald-50 text-emerald-700 ring-emerald-200' },
  out:    { label: 'Xuất CT',     prefix: 'PX', icon: 'truck',         cls: 'bg-sky-50 text-sky-700 ring-sky-200' },
  return: { label: 'Trả về kho',  prefix: 'PT', icon: 'undo-2',        cls: 'bg-violet-50 text-violet-700 ring-violet-200' }
};
const CAT_PALETTE = [
  { cls: 'bg-slate-100 text-slate-700 ring-slate-200',       bar: 'bg-slate-500' },
  { cls: 'bg-amber-50 text-amber-700 ring-amber-200',        bar: 'bg-amber-500' },
  { cls: 'bg-stone-100 text-stone-700 ring-stone-200',       bar: 'bg-stone-500' },
  { cls: 'bg-orange-50 text-orange-700 ring-orange-200',     bar: 'bg-orange-500' },
  { cls: 'bg-sky-50 text-sky-700 ring-sky-200',              bar: 'bg-sky-600' },
  { cls: 'bg-violet-50 text-violet-700 ring-violet-200',     bar: 'bg-violet-500' },
  { cls: 'bg-cyan-50 text-cyan-700 ring-cyan-200',           bar: 'bg-cyan-600' },
  { cls: 'bg-lime-50 text-lime-700 ring-lime-200',           bar: 'bg-lime-600' },
  { cls: 'bg-rose-50 text-rose-700 ring-rose-200',           bar: 'bg-rose-500' },
  { cls: 'bg-teal-50 text-teal-700 ring-teal-200',           bar: 'bg-teal-600' },
  { cls: 'bg-indigo-50 text-indigo-700 ring-indigo-200',     bar: 'bg-indigo-500' },
  { cls: 'bg-fuchsia-50 text-fuchsia-700 ring-fuchsia-200',  bar: 'bg-fuchsia-500' }
];

/* ============ 3. STORE ============ */
const STORAGE_KEY = 'buildledger.data.v2';
const OLD_KEYS = ['buildledger.state.v1']; // bản cũ chỉ chứa dữ liệu mẫu → dọn bỏ

function emptyState(company = {}) {
  return {
    app: 'BuildLedger', version: 2,
    company: { name: company.name || '', user: company.user || '', phone: company.phone || '', taxCode: company.taxCode || '' },
    settings: { categories: [...DEFAULT_CATEGORIES], units: [...DEFAULT_UNITS] },
    materials: [], suppliers: [], customers: [], projects: [], movements: [], payables: [], receivables: [],
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), lastBackup: null
  };
}
function normalizeState(d) {
  const base = emptyState();
  const st = { ...base, ...d };
  st.company = { ...base.company, ...(d.company || {}) };
  st.settings = { ...base.settings, ...(d.settings || {}) };
  ['materials', 'suppliers', 'customers', 'projects', 'movements', 'payables', 'receivables']
    .forEach(k => { if (!Array.isArray(st[k])) st[k] = []; });
  st.projects.forEach(p => { if (!Array.isArray(p.budget)) p.budget = []; });
  st.payables.concat(st.receivables).forEach(i => { if (!Array.isArray(i.payments)) i.payments = []; });
  return st;
}

const Store = {
  real: null,     // dữ liệu thật (được lưu)
  demo: null,     // dữ liệu mẫu (chỉ trong bộ nhớ)
  mode: null,     // 'real' | 'demo' | null (chưa bắt đầu)
  rev: 0,
  storageOK: true,
  get state() { return this.mode === 'demo' ? this.demo : this.real; },
  init() {
    try {
      OLD_KEYS.forEach(k => localStorage.removeItem(k));
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) this.real = normalizeState(JSON.parse(raw));
    } catch (e) { this.storageOK = false; }
    this.mode = this.real ? 'real' : null;
  },
  persist() {
    if (this.mode !== 'real' || !this.real) return;
    this.real.updatedAt = new Date().toISOString();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.real)); }
    catch (e) { toast('Không lưu được vào trình duyệt (bộ nhớ đầy hoặc bị chặn). Hãy tải file sao lưu ngay!', 'error'); }
  },
  /** Transaction: mutator chạy trên bản sao; hợp lệ mới áp dụng. */
  commit(mutator) {
    const draft = structuredClone(this.state);
    const result = mutator(draft);
    validateState(draft);
    if (this.mode === 'demo') this.demo = draft; else this.real = draft;
    this.rev++;
    this.persist();
    return result;
  },
  startReal(company) { this.real = emptyState(company); this.mode = 'real'; this.rev++; this.persist(); },
  startDemo() { this.demo = buildDemo(); this.mode = 'demo'; this.rev++; },
  exitDemo() { this.demo = null; this.mode = this.real ? 'real' : null; this.rev++; },
  replaceReal(data) { this.real = normalizeState(data); this.demo = null; this.mode = 'real'; this.rev++; this.persist(); },
  wipe() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} this.real = null; this.demo = null; this.mode = null; this.rev++; }
};
const S = () => Store.state;

/* ============ 4. INVENTORY ENGINE ============
 * Phát lại toàn bộ chứng từ theo ngày để tính tồn kho, đơn giá bình quân
 * gia quyền (BQGQ), giá vốn từng dòng xuất và vật tư đã dùng theo dự án. */
function computeInventory(st) {
  const mats = {}, usage = {}, lineCost = {}, errors = [];
  st.materials.forEach(m => { mats[m.id] = { stock: +m.openQty || 0, avg: +m.openCost || 0, inQty: 0, outQty: 0, lastPrice: +m.openCost || 0 }; });
  const mvs = [...st.movements].sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
  for (const mv of mvs) {
    mv.lines.forEach((ln, i) => {
      const s = mats[ln.m]; if (!s) return;
      const q = +ln.qty || 0, key = mv.id + ':' + i;
      if (mv.type === 'in') {
        const nq = s.stock + q;
        s.avg = (s.stock > 0 && nq > 0) ? (s.stock * s.avg + q * ln.price) / nq : +ln.price;
        s.stock = nq; s.inQty += q; s.lastPrice = +ln.price; lineCost[key] = +ln.price;
      } else {
        const pu = (usage[mv.projectId] ||= {});
        const u = (pu[ln.m] ||= { qty: 0, cost: 0 });
        if (mv.type === 'out') {
          lineCost[key] = s.avg;
          s.stock -= q; s.outQty += q; u.qty += q; u.cost += q * s.avg;
          if (s.stock < -1e-9) errors.push({ kind: 'stock', mv, m: ln.m, value: s.stock });
        } else { // return
          const unit = u.qty > 1e-9 ? u.cost / u.qty : s.avg;
          lineCost[key] = unit;
          if (q > u.qty + 1e-9) errors.push({ kind: 'return', mv, m: ln.m, value: u.qty });
          const nq = s.stock + q;
          if (nq > 0) s.avg = (Math.max(0, s.stock) * s.avg + q * unit) / (Math.max(0, s.stock) + q);
          s.stock = nq; s.outQty -= q; u.qty -= q; u.cost -= q * unit;
        }
      }
    });
  }
  Object.values(mats).forEach(s => { s.stock = round3(s.stock); s.value = Math.max(0, s.stock) * s.avg; });
  return { mats, usage, lineCost, errors };
}

function validateState(st) {
  const inv = computeInventory(st);
  if (inv.errors.length) {
    const e = inv.errors[0];
    const m = st.materials.find(x => x.id === e.m);
    const name = m ? `${m.name}` : 'vật tư';
    if (e.kind === 'stock') throw new Error(`Không đủ tồn kho: "${name}" sẽ bị âm ${fmtNum(-e.value)} ${m?.unit || ''} tại phiếu ${e.mv.no} (${fmtDate(e.mv.date)}). Kiểm tra lại số lượng hoặc ngày chứng từ.`);
    throw new Error(`Phiếu ${e.mv.no}: trả về "${name}" nhiều hơn số công trình đã nhận (${fmtNum(e.value)} ${m?.unit || ''}).`);
  }
  for (const inv2 of [...st.payables, ...st.receivables]) {
    const paid = sum(inv2.payments, p => p.amount);
    if (paid > inv2.total + 0.5) throw new Error(`Hóa đơn ${inv2.no}: số đã thanh toán (${fmtVND(paid)}) lớn hơn tổng hóa đơn (${fmtVND(inv2.total)}).`);
  }
}

let _invCache = null, _invRev = -1, _invMode = null;
function INV() {
  if (!_invCache || _invRev !== Store.rev || _invMode !== Store.mode) {
    _invCache = computeInventory(S()); _invRev = Store.rev; _invMode = Store.mode;
  }
  return _invCache;
}

/* ============ 5. API LAYER ============
 * Mọi thao tác ghi đều đi qua đây (async). Khi có backend, thay phần thân
 * bằng fetch()/Firebase SDK và giữ nguyên chữ ký hàm, ví dụ:
 *   const res = await fetch(`${BASE_URL}/materials`, { method: 'POST',
 *     headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
 *     body: JSON.stringify(data) });
 *   if (!res.ok) throw new Error((await res.json()).message);
 * Backend nên tự kiểm tra tồn kho âm / số tiền vượt hóa đơn trong transaction.
 * ===================================== */
const findOrThrow = (list, id, what) => { const x = list.find(i => i.id === id); if (!x) throw new Error(`Không tìm thấy ${what}`); return x; };
const invoiceTotals = (subtotal, vatRate) => { const s = Math.round(+subtotal || 0); const vat = Math.round(s * (+vatRate || 0) / 100); return { subtotal: s, vatRate: +vatRate || 0, vatAmount: vat, total: s + vat }; };

const API = {
  // TODO(API): GET /api/bootstrap → toàn bộ dữ liệu của công ty
  async fetchAll() { return S(); },

  /* ----- Vật tư ----- */
  // TODO(API): POST /api/materials | PUT /api/materials/:id
  async saveMaterial(d) {
    return Store.commit(st => {
      if (st.materials.some(m => m.code === d.code && m.id !== d.id)) throw new Error('Mã vật tư đã tồn tại');
      if (d.id) Object.assign(findOrThrow(st.materials, d.id, 'vật tư'), d);
      else st.materials.push({ ...d, id: uid('m'), createdAt: Date.now() });
    });
  },
  // TODO(API): DELETE /api/materials/:id
  async deleteMaterial(id) {
    return Store.commit(st => {
      const n = st.movements.filter(mv => mv.lines.some(l => l.m === id)).length;
      if (n) throw new Error(`Không thể xóa: vật tư đã nằm trong ${n} phiếu nhập/xuất. Hãy xóa các phiếu đó trước.`);
      st.materials = st.materials.filter(m => m.id !== id);
      st.projects.forEach(p => { p.budget = p.budget.filter(b => b.m !== id); });
    });
  },

  /* ----- Nhà cung cấp ----- */
  // TODO(API): POST /api/suppliers | PUT /api/suppliers/:id
  async saveSupplier(d) {
    return Store.commit(st => {

/* ============ 6. SELECTORS ============ */
const matById = id => S().materials.find(m => m.id === id);
const supById = id => S().suppliers.find(s => s.id === id);
const cusById = id => S().customers.find(c => c.id === id);
const prjById = id => S().projects.find(p => p.id === id);
const mvById = id => S().movements.find(m => m.id === id);
const stockOf = id => INV().mats[id] || { stock: 0, avg: 0, value: 0, inQty: 0, outQty: 0, lastPrice: 0 };
const stockLevel = m => { const s = stockOf(m.id).stock; return s <= 0 ? 'out' : s < (+m.minStock || 0) ? 'low' : 'ok'; };
const paidOf = inv => sum(inv.payments, p => p.amount);
const remaining = inv => Math.max(0, inv.total - paidOf(inv));
const mvValue = mv => {
  if (mv.type === 'in') return sum(mv.lines, l => l.qty * l.price);
  const lc = INV().lineCost; return sum(mv.lines.map((l, i) => l.qty * (lc[mv.id + ':' + i] || 0)));
};
const mvParty = mv => mv.type === 'in' ? (supById(mv.supplierId)?.name || '—') : (prjById(mv.projectId)?.name || '—');

function invStatus(inv) {
  if (remaining(inv) === 0) return 'paid';
  const d = daysFromToday(inv.due);
  if (d < 0) return 'overdue';
  if (d <= 7) return 'soon';
  return 'open';
}
function partyOf(type, inv) {
  if (type === 'ap') { const s = supById(inv.supplierId); return { name: s?.name || '—', sub: s?.contact || '' }; }
  const c = cusById(inv.customerId), p = prjById(inv.projectId);
  return { name: c?.name || '—', sub: p ? p.name : '' };
}
function supplierStats(sid) {
  const inv = S().payables.filter(p => p.supplierId === sid);
  const open = inv.filter(p => remaining(p) > 0).sort((a, b) => a.due.localeCompare(b.due));
  return {
    count: inv.length, total: sum(inv, i => i.total), paid: sum(inv, paidOf), debt: sum(inv, remaining),
    overdue: sum(inv.filter(i => invStatus(i) === 'overdue'), remaining), nextDue: open[0]?.due || null, openCount: open.length
  };
}
function customerStats(cid) {
  const inv = S().receivables.filter(r => r.customerId === cid);
  return {
    projects: S().projects.filter(p => p.customerId === cid).length, total: sum(inv, i => i.total), paid: sum(inv, paidOf),
    debt: sum(inv, remaining), overdue: sum(inv.filter(i => invStatus(i) === 'overdue'), remaining), openCount: inv.filter(i => remaining(i) > 0).length
  };
}
/** Vật tư của dự án: gộp dự toán + thực xuất */
function projectMaterials(p) {
  const usage = INV().usage[p.id] || {};
  const ids = [...new Set([...p.budget.map(b => b.m), ...Object.keys(usage)])];
  return ids.map(id => {
    const b = p.budget.find(x => x.m === id), u = usage[id];
    return { m: id, mat: matById(id), planned: b ? +b.planned : 0, used: round3(u?.qty || 0), cost: u?.cost || 0 };
  }).filter(x => x.mat && (x.planned > 0 || Math.abs(x.used) > 1e-9));
}
const projectCost = p => sum(Object.values(INV().usage[p.id] || {}), u => u.cost);

function projectHealth(p) {
  if (p.status === 'completed') return { delayed: false, expected: 100 };
  if (!p.start || !p.end) return { delayed: false, expected: null };
  const total = Math.max(1, dayDiff(p.start, p.end));
  const expected = clamp(Math.round(dayDiff(p.start, todayISO()) / total * 100), 0, 100);
  const left = daysFromToday(p.end);
  if (left < 0) return { delayed: true, expected, reason: `Quá hạn bàn giao ${-left} ngày`, severity: 'high' };
  if ((+p.progress || 0) < expected - 15) return { delayed: true, expected, reason: `Thực tế ${p.progress || 0}% / kế hoạch ${expected}%`, severity: 'mid' };
  return { delayed: false, expected };
}
function getAlerts() {
  const lowStock = S().materials.filter(m => stockLevel(m) !== 'ok' && ((+m.minStock || 0) > 0 || stockOf(m.id).stock < 0))
    .sort((a, b) => stockOf(a.id).stock / (a.minStock || 1) - stockOf(b.id).stock / (b.minStock || 1));
  const overdue = [
    ...S().payables.filter(i => invStatus(i) === 'overdue').map(i => ({ type: 'ap', inv: i })),
    ...S().receivables.filter(i => invStatus(i) === 'overdue').map(i => ({ type: 'ar', inv: i }))
  ].sort((a, b) => a.inv.due.localeCompare(b.inv.due));
  const delays = S().projects.map(p => ({ p, h: projectHealth(p) })).filter(x => x.h.delayed);
  return { lowStock, overdue, delays, total: lowStock.length + overdue.length + delays.length };
}
function catStyle(c) {
  const cats = S()?.settings.categories || DEFAULT_CATEGORIES;
  let i = cats.indexOf(c);
  if (i < 0) i = [...String(c)].reduce((a, ch) => a + ch.charCodeAt(0), 0);
  return CAT_PALETTE[i % CAT_PALETTE.length];
}

/* ---- Toast ---- */
function toast(msg, tone = 'success') {
  const tones = { success: ['circle-check', 'text-emerald-400'], error: ['circle-x', 'text-rose-400'], info: ['info', 'text-sky-400'] };
  const [ic, col] = tones[tone] || tones.info;
  const el = document.createElement('div');
  el.className = 'toast pointer-events-auto flex items-start gap-3 bg-slate-900 text-white text-sm rounded-xl shadow-2xl px-4 py-3 sm:max-w-md';
  el.innerHTML = `<span class="${col} mt-0.5">${icon(ic, '!w-4 !h-4')}</span><span class="flex-1">${esc(msg)}</span>`;
  $('#toast-root').appendChild(el);
  refreshIcons();
  setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 260); }, tone === 'error' ? 6000 : 3200);
}
/** Chạy thao tác API: bắt lỗi → toast. Trả về true nếu thành công. */
async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) { console.warn(e.message); toast(e.message || String(e), 'error'); return false; }
}

/** Validation động cho form. rules: { name: (value, form) => lỗi | null } */
function bindValidation(form, rules, onChange) {
  const check = name => {
    const el = form.elements[name];
    if (!el || !rules[name]) return true;
    const err = rules[name](String(el.value).trim(), form);
    el.classList.toggle('is-invalid', !!err);
    el.classList.toggle('is-valid', !err && el.value !== '');
    const p = form.querySelector(`[data-err="${name}"]`);
    if (p) { p.textContent = err || ''; p.classList.toggle('hidden', !err); }
    return !err;
  };
  const handler = e => { if (e.target.name && rules[e.target.name] !== undefined) check(e.target.name); if (e.target.name) onChange && onChange(e.target.name, check); };
  form.addEventListener('input', handler);
  form.addEventListener('change', handler);
  return () => Object.keys(rules).map(check).every(Boolean);
}
const numRule = (label, { allowZero = true, required = true } = {}) => v => {
  if (v === '') return required ? `Nhập ${label}` : null;
  if (isNaN(v)) return `${label} phải là số`;
  if (+v < 0 || (!allowZero && +v === 0)) return `${label} phải ${allowZero ? '≥ 0' : '> 0'}`;
  return null;
};

function confirmDialog({ title, message, confirmText = 'Xác nhận', danger = false, typeToConfirm = null, onConfirm }) {

    <div class="px-6 py-5 text-sm text-slate-600 space-y-3">
      <div>${message}</div>
      ${typeToConfirm ? `<div><label class="block text-xs text-slate-500 mb-1">Gõ <b class="font-mono text-slate-800">${typeToConfirm}</b> để xác nhận</label><input id="confirm-text" class="${inputCls} font-mono" autocomplete="off"></div>` : ''}
    </div>
    ${modalFooter(`<div class="flex-1"></div>
      <button type="button" class="${btnGhost}" data-action="close-modal">Hủy</button>
      <button type="button" id="confirm-ok" class="${btnPrimary} ${danger ? '!bg-rose-600 hover:!bg-rose-700' : ''}" ${typeToConfirm ? 'disabled' : ''}>${confirmText}</button>`)}
  `, 'max-w-md');
  if (typeToConfirm) $('#confirm-text').addEventListener('input', e => { $('#confirm-ok').disabled = e.target.value.trim().toUpperCase() !== typeToConfirm; });
  $('#confirm-ok').addEventListener('click', async () => { const ok = await onConfirm(); if (ok !== false) closeModal(); });
}

function filteredMaterials() {

  return S().materials
    .filter(m => cat === 'all' || m.category === cat)
    .filter(m => level === 'all' || (level === 'low' ? stockLevel(m) !== 'ok' : stockLevel(m) === 'ok'))
    .filter(m => !k || noAccent(m.name.toLowerCase()).includes(k) || m.code.toLowerCase().includes(k))
    .sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y, 'vi') : x - y) * dir; });
}

/* ---------- 8.3 PROJECTS ---------- */
function projectCard(p) {
  const h = projectHealth(p), done = p.status === 'completed';
  const left = p.end ? daysFromToday(p.end) : null;
  const cus = cusById(p.customerId);
  const mats = projectMaterials(p), cost = projectCost(p);
  const statusBadgeHtml = done
    ? `<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium bg-emerald-50 text-emerald-700 ring-1 ring-inset ring-emerald-200">${icon('circle-check')} Hoàn thành</span>`
    : `<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium bg-sky-50 text-sky-700 ring-1 ring-inset ring-sky-200"><span class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></span> Đang thi công</span>`;
  const delayBadge = h.delayed ? `<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium bg-orange-50 text-orange-700 ring-1 ring-inset ring-orange-200">${icon('triangle-alert')} Chậm tiến độ</span>` : '';
  const barColor = done ? 'bg-emerald-500' : h.delayed ? 'bg-orange-500' : 'bg-sky-500';
  const arDebt = sum(S().receivables.filter(r => r.projectId === p.id), remaining);
  return `<article class="bg-white rounded-2xl border border-slate-200/80 shadow-card hover:shadow-lg transition flex flex-col overflow-hidden">
    <div class="h-1.5 ${done ? 'bg-gradient-to-r from-emerald-400 to-emerald-600' : h.delayed ? 'bg-gradient-to-r from-orange-400 to-rose-500' : 'bg-gradient-to-r from-sky-400 to-slate-700'}"></div>
    <div class="p-5 flex-1">
      <div class="flex items-center justify-between gap-2">
        <span class="font-mono text-xs font-semibold text-slate-400">${esc(p.code)}</span>
        <div class="flex flex-wrap justify-end gap-1.5">${delayBadge}${statusBadgeHtml}</div>
      </div>
      <h3 class="mt-2 font-semibold text-slate-900 leading-snug">${esc(p.name)}</h3>
      <div class="mt-2 space-y-1 text-sm text-slate-500">
        ${p.location ? `<div class="flex items-center gap-2">${icon('map-pin', 'text-slate-400')} ${esc(p.location)}</div>` : ''}
        <div class="flex items-center gap-2">${icon('building-2', 'text-slate-400')} <span class="truncate">${esc(cus?.name || 'Chưa gán khách hàng')}</span></div>
        ${p.manager ? `<div class="flex items-center gap-2">${icon('user', 'text-slate-400')} ${esc(p.manager)}</div>` : ''}
      </div>
      <div class="mt-4">
        <div class="flex items-center justify-between text-xs mb-1.5">
          <span class="text-slate-500">Tiến độ thi công ${!done && h.expected !== null ? `<span class="text-slate-400">· KH ${h.expected}%</span>` : ''}</span>
          <span class="font-semibold text-slate-900 num">${+p.progress || 0}%</span>
        </div>
        ${progressBar(p.progress, barColor, 'h-2', done ? null : h.expected)}
        <div class="flex items-center justify-between text-xs text-slate-500 mt-2">
          <span>${fmtDate(p.start)} → ${fmtDate(p.end)}</span>
          <span class="${!done && left !== null && left < 0 ? 'text-rose-600 font-medium' : ''}">${done ? 'Đã bàn giao' : left === null ? '' : left < 0 ? `Trễ ${-left} ngày` : `Còn ${left} ngày`}</span>
        </div>
        ${h.delayed ? `<div class="mt-2 text-xs rounded-lg bg-orange-50 text-orange-700 px-2.5 py-1.5">${esc(h.reason)}</div>` : ''}
      </div>
    </div>
    <div class="px-5 py-4 border-t border-slate-100 bg-slate-50/60">
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Vật tư: đã xuất / dự toán</span>
        <span class="text-xs text-slate-500 num">${fmtCompact(cost)} ₫</span>
      </div>
      ${mats.length ? `<ul class="space-y-2.5 max-h-56 overflow-y-auto pr-1">${mats.map(x => {
        const pct = x.planned ? Math.round(x.used / x.planned * 100) : 0, over = x.planned && x.used > x.planned + 1e-9;
        return `<li><div class="flex items-center justify-between gap-2 text-xs">
            <span class="text-slate-700 truncate">${esc(x.mat.name)}</span>
            <span class="num whitespace-nowrap ${over ? 'text-rose-600' : 'text-slate-500'}"><b class="font-medium ${over ? '' : 'text-slate-800'}">${fmtNum(x.used)}</b> / ${x.planned ? fmtNum(x.planned) : '<span title="Chưa có dự toán">—</span>'} ${esc(x.mat.unit)}</span></div>
          <div class="mt-1">${progressBar(x.planned ? pct : 100, over ? 'bg-rose-500' : !x.planned ? 'bg-slate-300' : pct >= 90 ? 'bg-emerald-500' : 'bg-slate-400', 'h-1')}</div>
          ${over ? `<div class="text-[11px] text-rose-600 mt-0.5">Vượt dự toán ${fmtNum(round3(x.used - x.planned))} ${esc(x.mat.unit)}</div>` : ''}</li>`;
      }).join('')}</ul>` : `<p class="text-xs text-slate-400">Chưa có dự toán hoặc phiếu xuất vật tư.</p>`}
    </div>
    <div class="px-5 py-3 border-t border-slate-100 flex items-center gap-2">
      <div class="text-xs text-slate-500 flex-1 min-w-0">Giá trị HĐ<div class="text-sm font-semibold text-slate-900 num">${fmtCompact(p.contract)} ₫</div>${arDebt ? `<div class="text-[11px] text-emerald-700">Còn phải thu ${fmtCompact(arDebt)} ₫</div>` : ''}</div>
      ${iconBtn('project-edit', `data-id="${p.id}"`, 'pencil', 'Sửa dự án')}
      ${iconBtn('project-delete', `data-id="${p.id}"`, 'trash-2', 'Xóa dự án', 'rose')}
      ${done ? '' : `<button data-action="mv-new" data-type="out" data-project="${p.id}" class="inline-flex items-center gap-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium px-3 py-2 transition">${icon('truck')} Xuất VT</button>`}
    </div>
  </article>`;
}
function renderProjects() {
  const all = S().projects, f = ui.projFilter;
  const list = all.filter(p => f === 'all' || (f === 'delayed' ? projectHealth(p).delayed : p.status === f))
    .sort((a, b) => (a.status === 'completed') - (b.status === 'completed') || String(b.code).localeCompare(String(a.code)));
  const tabs = [['all', 'Tất cả', all.length], ['active', 'Đang thi công', all.filter(p => p.status === 'active').length],
    ['delayed', 'Chậm tiến độ', all.filter(p => projectHealth(p).delayed).length], ['completed', 'Hoàn thành', all.filter(p => p.status === 'completed').length]];
  return `<div class="space-y-5">
    <div class="flex flex-wrap items-center gap-2">
      ${tabs.map(([k, l, n]) => `<button data-action="proj-filter" data-f="${k}" class="inline-flex items-center gap-2 rounded-full px-3.5 py-1.5 text-sm font-medium transition ${f === k ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:border-slate-300'}">${l}<span class="text-xs rounded-full px-1.5 ${f === k ? 'bg-white/15' : 'bg-slate-100'}">${n}</span></button>`).join('')}
      <div class="flex gap-2 sm:ml-auto">${excelBtn('projects')}<button data-action="project-new" class="${btnPrimary}">${icon('plus', '!w-4 !h-4')} Tạo dự án</button></div>
    </div>
    ${!all.length ? card(emptyBox('hard-hat', 'Chưa có dự án', 'Tạo dự án để theo dõi tiến độ, dự toán vật tư, xuất kho cho công trường và công nợ phải thu.', `<button data-action="project-new" class="${btnPrimary}">${icon('plus', '!w-4 !h-4')} Tạo dự án đầu tiên</button>`))
      : `<div class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-5">${list.map(projectCard).join('') || `<div class="col-span-full text-center text-slate-400 py-16">Không có dự án trong mục này</div>`}</div>`}
  </div>`;
}

/* ---------- 8.4 SUPPLIERS ---------- */
function supplierRows() {
  if (!S().suppliers.length) return emptyBox('truck', 'Chưa có nhà cung cấp', 'Thêm các đơn vị cung ứng vật tư để lập phiếu nhập và theo dõi công nợ phải trả.', `<button data-action="supplier-new" class="${btnPrimary}">${icon('plus', '!w-4 !h-4')} Thêm nhà cung cấp</button>`);
  const k = noAccent(ui.sup.q.trim().toLowerCase());
  const list = S().suppliers.filter(s => !k || noAccent([s.name, s.contact, s.phone, s.taxCode, ...(s.types || [])].join(' ').toLowerCase()).includes(k))
    .map(s => ({ s, st: supplierStats(s.id) })).sort((a, b) => b.st.debt - a.st.debt || a.s.name.localeCompare(b.s.name, 'vi'));
  if (!list.length) return `<div class="px-6 py-16 text-center text-sm text-slate-400">Không tìm thấy nhà cung cấp</div>`;
  return list.map(({ s, st }) => {
    const paidPct = st.total ? Math.round(st.paid / st.total * 100) : 100;

      <div class="lg:col-span-4 flex items-center gap-3 min-w-0">

          <div class="text-xs text-slate-500 truncate">${s.taxCode ? 'MST ' + esc(s.taxCode) + ' · ' : ''}${esc(s.address || '')}</div></div>
      </div>
      <div class="lg:col-span-2 text-sm"><div class="text-slate-800 truncate">${esc(s.contact || '—')}</div>
        ${s.phone ? `<a href="tel:${esc(s.phone.replace(/[^\d+]/g, ''))}" class="text-xs text-slate-500 hover:text-emerald-700 inline-flex items-center gap-1 num">${icon('phone')} ${esc(s.phone)}</a>` : ''}</div>
      <div class="lg:col-span-2 flex flex-wrap gap-1">${(s.types || []).map(catBadge).join('')}<span class="text-[11px] text-slate-400 w-full mt-0.5">Công nợ ${+s.terms || 0} ngày</span></div>
      <div class="lg:col-span-3">
        <div class="flex items-baseline justify-between gap-2"><span class="text-xs text-slate-500">Dư nợ hiện tại</span>
          <span class="text-base font-semibold num ${st.debt ? 'text-slate-900' : 'text-emerald-600'}">${st.count ? (st.debt ? fmtVND(st.debt) : 'Đã tất toán') : '—'}</span></div>
        <div class="mt-1.5">${progressBar(paidPct, 'bg-emerald-500', 'h-1.5')}</div>

          ${st.overdue ? `<span class="text-rose-600 font-medium">Quá hạn ${fmtCompact(st.overdue)} ₫</span>` : st.nextDue ? `<span>Hạn gần nhất ${fmtDate(st.nextDue)}</span>` : ''}</div>
      </div>
      <div class="lg:col-span-1 flex lg:justify-end gap-0.5">
        ${iconBtn('supplier-ledger', `data-name="${esc(s.name)}"`, 'book-open', 'Xem sổ công nợ', 'sky')}
        ${iconBtn('supplier-edit', `data-id="${s.id}"`, 'pencil', 'Sửa')}
        ${iconBtn('supplier-delete', `data-id="${s.id}"`, 'trash-2', 'Xóa', 'rose')}
      </div></div>`;
  }).join('');
}
function renderSuppliers() {

/* ---------- 8.6 LEDGER ---------- */
function ledgerList(type) {
  const k = noAccent(ui.ledger.q.trim().toLowerCase()), f = ui.ledger[type];
  const rank = { overdue: 0, soon: 1, open: 2, paid: 3 };
  return (type === 'ap' ? S().payables : S().receivables)
    .map(inv => ({ inv, party: partyOf(type, inv), st: invStatus(inv) }))
    .filter(x => !k || noAccent([x.inv.no, x.inv.desc, x.party.name, x.party.sub].join(' ').toLowerCase()).includes(k))
    .filter(x => f === 'all' || (f === 'open' ? x.st !== 'paid' : f === 'overdue' ? x.st === 'overdue' : x.st === 'paid'))
    .sort((a, b) => rank[a.st] - rank[b.st] || a.inv.due.localeCompare(b.inv.due));
}

function openMovementModal(type, { id, projectId, materialId } = {}) {
  const st = S();
  const edit = id ? mvById(id) : null;
  if (id && !edit) return;
  if (edit) type = edit.type;
  const T = MV_TYPES[type];
  if (!st.materials.length) { toast('Hãy khai báo vật tư trước', 'info'); return openMaterialModal(); }
  if (type === 'in' && !st.suppliers.length) { toast('Hãy thêm nhà cung cấp trước khi nhập kho', 'info'); return openSupplierModal(); }
  const projects = st.projects.filter(p => p.status !== 'completed' || p.id === edit?.projectId);
  if (type !== 'in' && !projects.length) { toast(st.projects.length ? 'Không có dự án đang thi công' : 'Hãy tạo dự án trước', 'info'); return st.projects.length ? null : openProjectModal(); }
  const ap = edit && type === 'in' ? st.payables.find(p => p.receiptId === edit.id) : null;
  const lines = edit ? edit.lines.map(l => ({ ...l })) : [{ m: materialId || '', qty: '', price: materialId && type === 'in' ? (stockOf(materialId).lastPrice || '') : '' }];
  const origQty = mid => edit ? sum(edit.lines.filter(l => l.m === mid), l => l.qty) : 0;
  const defSupplier = edit?.supplierId || (materialId && matById(materialId)?.supplierId) || '';
  const no = edit ? edit.no : nextNo(T.prefix, st.movements.map(m => m.no));
  const date = edit?.date || todayISO();

      ${field('invoiceRef', 'Số hóa đơn NCC', `<input id="f-invoiceRef" name="invoiceRef" class="${inputCls}" value="${esc(edit?.invoiceRef || '')}" placeholder="Không bắt buộc">`)}

      ${field('date', `Ngày ${type === 'out' ? 'xuất' : 'trả'} ${req}`, `<input id="f-date" name="date" type="date" class="${inputCls}" value="${date}">`)}
      ${field('projectId', `Dự án ${req}`, `<select id="f-projectId" name="projectId" class="${inputCls}"><option value="">— Chọn dự án —</option>${projects.map(p => opt(p.id, `${p.code} · ${p.name}`, p.id === (edit?.projectId || projectId))).join('')}</select>`)}

  openModal(`
    <form id="mv-form" novalidate class="flex flex-col min-h-0">
      ${modalHeader(`${titles[type]}${edit ? ' · ' + esc(edit.no) : ''}`, subs[type], T.icon, type === 'in' ? 'bg-emerald-50 text-emerald-600' : type === 'out' ? 'bg-sky-50 text-sky-600' : 'bg-violet-50 text-violet-600')}
      <div class="px-5 sm:px-6 py-5 overflow-y-auto space-y-5">

        </div>
        ${type === 'in' && !edit ? `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 rounded-xl bg-slate-50 border border-slate-200 p-4">
          ${field('payNow', 'Số tiền trả ngay (₫)', `<input id="f-payNow" name="payNow" type="number" step="1" min="0" class="${inputCls} num" placeholder="0 = ghi nợ toàn bộ">
            <div class="flex gap-1.5 mt-2"><button type="button" data-paynow="0" class="rounded-md bg-white border border-slate-200 hover:border-emerald-400 text-xs px-2.5 py-1">Ghi nợ</button><button type="button" data-paynow="all" class="rounded-md bg-white border border-slate-200 hover:border-emerald-400 text-xs px-2.5 py-1">Trả đủ</button></div>`)}
          ${field('payMethod', 'Hình thức trả ngay', `<select id="f-payMethod" name="payMethod" class="${inputCls}">${PAY_METHODS.map(m => opt(m, m)).join('')}</select>`)}
        </div>` : ''}
        ${type === 'in' && edit && ap ? `<div class="text-xs text-slate-500 rounded-lg bg-slate-50 border border-slate-200 px-3 py-2">Công nợ ${esc(ap.no)} đã thanh toán ${fmtVND(paidOf(ap))}. Các lần thanh toán quản lý tại <b>Sổ công nợ</b>.</div>` : ''}
        ${field('note', type === 'in' ? 'Ghi chú' : 'Ghi chú (người nhận, xe vận chuyển…)', `<input id="f-note" name="note" class="${inputCls}" value="${esc(edit?.note || '')}" maxlength="200">`)}
      </div>
      ${modalFooter(`
        ${edit ? `<button type="button" data-action="mv-delete" data-id="${edit.id}" class="inline-flex items-center gap-1.5 text-sm text-rose-600 hover:text-rose-700 font-medium">${icon('trash-2', '!w-4 !h-4')} Xóa phiếu</button>` : ''}
        <div class="flex-1"></div><button type="button" class="${btnGhost}" data-action="close-modal">Hủy</button>

    </form>`, 'max-w-4xl');

  const form = $('#mv-form');
  const curProject = () => form.elements.projectId?.value || '';
  const usedIn = (pid, mid) => (INV().usage[pid]?.[mid]?.qty || 0) + (edit && edit.projectId === pid && type === 'return' ? origQty(mid) : 0) - (edit && edit.projectId === pid && type === 'out' ? origQty(mid) : 0);
  const available = mid => type === 'out' ? stockOf(mid).stock + origQty(mid) : type === 'return' ? usedIn(curProject(), mid) : Infinity;

  const lineInfo = (l) => {
    const m = matById(l.m); if (!m) return '<span class="text-slate-300">—</span>';
    const q = +l.qty || 0;
    if (type === 'in') return `<span class="num font-medium text-slate-900">${fmtVND(q * (+l.price || 0))}</span>`;
    if (type === 'out') {
      const av = available(l.m), pid = curProject(), p = prjById(pid), b = p?.budget.find(x => x.m === l.m);
      const usedAfter = usedIn(pid, l.m) + q;
      return `<div class="text-xs leading-5"><div class="${q > av ? 'text-rose-600 font-medium' : 'text-slate-600'}">Tồn: <b class="num">${fmtNum(av)}</b> ${esc(m.unit)}</div>

    }
    const av = available(l.m);
    return `<div class="text-xs leading-5"><div class="${q > av ? 'text-rose-600 font-medium' : 'text-slate-600'}">CT đã nhận: <b class="num">${fmtNum(av)}</b> ${esc(m.unit)}</div></div>`;
  };
  const rowHtml = (l, i) => `<tr data-li="${i}" class="align-top">
    <td class="px-3 py-2.5 text-xs text-slate-400 pt-4">${i + 1}</td>

    <td class="px-3 py-2 text-right pt-3" data-linfo="${i}">${lineInfo(l)}</td>
    <td class="px-2 py-2 pt-3"><button type="button" data-lremove="${i}" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 ${lines.length < 2 ? 'invisible' : ''}" title="Xóa dòng">${icon('x', '!w-4 !h-4')}</button></td></tr>`;
  const renderLines = () => { $('#lines-body').innerHTML = lines.map(rowHtml).join(''); refreshIcons(); renderTotals(); };
  const grand = () => { const sub = sum(lines, l => (+l.qty || 0) * (+l.price || 0)); return invoiceTotals(sub, form.elements.vatRate?.value || 0); };
  const renderTotals = () => {
    if (type === 'in') {
      const t = grand();
      $('#mv-totals').innerHTML = `<div class="text-slate-500">Tiền hàng <b class="num text-slate-800">${fmtVND(t.subtotal)}</b> · VAT ${t.vatRate}% <b class="num text-slate-800">${fmtVND(t.vatAmount)}</b></div>
        <div class="text-base">Tổng thanh toán: <b class="num text-emerald-700">${fmtVND(t.total)}</b></div>`;
    } else {
      $('#mv-totals').innerHTML = `<div class="text-slate-500">Giá trị ước tính (giá BQ): <b class="num text-slate-800">${fmtVND(sum(lines, l => (+l.qty || 0) * stockOf(l.m).avg))}</b></div>`;
    }
    lines.forEach((l, i) => { const c = $(`[data-linfo="${i}"]`); if (c) c.innerHTML = lineInfo(l); });
  };
  const validateLines = () => {
    let ok = true; const seen = new Set();
    lines.forEach((l, i) => {
      const q = +l.qty;
      let err = !l.m ? 'Chọn vật tư' : seen.has(l.m) ? 'Vật tư bị trùng — gộp vào một dòng' : !(q > 0) ? 'Nhập số lượng > 0' : null;
      if (!err && type === 'in' && !(+l.price > 0)) err = 'Nhập đơn giá > 0';
      if (!err && type === 'out' && q > available(l.m) + 1e-9) err = `Vượt tồn kho (${fmtNum(available(l.m))})`;
      if (!err && type === 'return' && q > available(l.m) + 1e-9) err = `Vượt số công trình đã nhận (${fmtNum(available(l.m))})`;
      seen.add(l.m);
      const p = $(`[data-lerr="${i}"]`); if (p) { p.textContent = err || ''; p.classList.toggle('hidden', !err); }
      if (err) ok = false;
    });
    return ok;
  };
  renderLines();
  $('#line-add').addEventListener('click', () => { lines.push({ m: '', qty: '', price: '' }); renderLines(); $(`[data-li="${lines.length - 1}"] select`)?.focus(); });
  const onLine = e => {
    const row = e.target.closest('[data-li]'); if (!row || !e.target.dataset.lf) return;
    const i = +row.dataset.li, f = e.target.dataset.lf;
    lines[i][f] = e.target.value;
    if (f === 'm' && type === 'in' && e.target.value && !lines[i].price) {
      lines[i].price = stockOf(e.target.value).lastPrice || ''; const pi = row.querySelector('[data-lf="price"]'); if (pi) pi.value = lines[i].price;
    }
    renderTotals();
    const p = $(`[data-lerr="${i}"]`); if (p && !p.classList.contains('hidden')) validateLines();
  };
  $('#lines-body').addEventListener('input', onLine);
  $('#lines-body').addEventListener('change', onLine);
  $('#lines-body').addEventListener('click', e => { const b = e.target.closest('[data-lremove]'); if (b && lines.length > 1) { lines.splice(+b.dataset.lremove, 1); renderLines(); } });

  let dueTouched = !!edit;
  $$('[data-paynow]', form).forEach(b => b.addEventListener('click', () => {
    form.elements.payNow.value = b.dataset.paynow === 'all' ? grand().total : '';
    form.elements.payNow.dispatchEvent(new Event('input', { bubbles: true }));
  }));
  const rules = {
    no: v => !v ? 'Nhập số phiếu' : st.movements.some(m => m.no === v && m.id !== id) ? 'Số phiếu đã tồn tại' : null,
    date: v => !v ? 'Chọn ngày' : null
  };
  if (type === 'in') Object.assign(rules, {
    supplierId: v => !v ? 'Chọn nhà cung cấp' : null,
    due: (v, f) => !v ? 'Chọn hạn thanh toán' : v < f.elements.date.value ? 'Không được trước ngày nhập' : null,
    ...(edit ? {} : { payNow: v => v === '' ? null : isNaN(v) || +v < 0 ? 'Số tiền không hợp lệ' : +v > grand().total ? `Vượt tổng phiếu (${fmtVND(grand().total)})` : null })
  });
  else rules.projectId = v => !v ? 'Chọn dự án' : null;
  const validateAll = bindValidation(form, rules, name => {
    if (name === 'due') dueTouched = true;
    if (type === 'in' && !dueTouched && (name === 'supplierId' || name === 'date')) {
      const s = supById(form.elements.supplierId.value);
      if (s && form.elements.date.value) form.elements.due.value = addDays(+s.terms || 0, form.elements.date.value);
    }
    if (name === 'vatRate' || name === 'projectId') renderTotals();
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const a = validateAll(), b = validateLines();
    if (!a || !b) return toast('Vui lòng kiểm tra lại các ô được đánh dấu đỏ', 'error');
    const fd = Object.fromEntries(new FormData(form));
    const ok = await run(() => API.saveMovement({
      id: edit?.id, type, no: fd.no.trim(), date: fd.date, note: (fd.note || '').trim(),
      supplierId: fd.supplierId, projectId: fd.projectId, invoiceRef: (fd.invoiceRef || '').trim(), vatRate: +fd.vatRate || 0, due: fd.due,
      payNow: +fd.payNow || 0, payMethod: fd.payMethod, lines: lines.map(l => ({ m: l.m, qty: +l.qty, price: +l.price || 0 }))
    }), edit ? `Đã cập nhật phiếu ${fd.no}` : type === 'in' ? `Đã nhập kho ${fd.no} và ghi công nợ NCC` : `Đã lưu phiếu ${fd.no}`);
    if (ok) afterSave();
  });
}
function confirmDeleteMovement(id) {

/* ---- 9.6 Hóa đơn công nợ (tạo tay / sửa) ---- */

        </div>
        ${!isAP ? field('no', `Số hóa đơn / chứng từ ${req}`, `<input id="f-no" name="no" class="${inputCls} font-mono" value="${esc(d.no)}">`) : ''}
        ${field('desc', `Nội dung ${req}`, `<input id="f-desc" name="desc" class="${inputCls}" value="${esc(d.desc)}" placeholder="${isAP ? 'VD: Công nợ đầu kỳ / Cước vận chuyển tháng 9' : 'VD: Nghiệm thu đợt 2 – phần thô'}">`)}

  const rules = {
    no: v => !v ? 'Nhập số hóa đơn' : list.some(x => x.no === v && x.id !== id && (isAP ? x.supplierId === (form.elements.supplierId.value) : true)) ? 'Số hóa đơn đã tồn tại' : null,
    desc: v => v.length < 2 ? 'Nhập nội dung' : null,
    due: (v, f) => !v ? 'Chọn hạn thanh toán' : v < f.elements.issued.value ? 'Không được trước ngày hóa đơn' : null
  };
  if (!locked) Object.assign(rules, {
    issued: v => !v ? 'Chọn ngày' : null,
    subtotal: (v, f) => { const e2 = numRule('Số tiền', { allowZero: false })(v); if (e2) return e2; const t = invoiceTotals(v, f.elements.vatRate.value).total; return inv && t < paidOf(inv) ? `Tổng mới nhỏ hơn số đã thanh toán (${fmtVND(paidOf(inv))})` : null; },
    [isAP ? 'supplierId' : 'customerId']: v => !v ? 'Chọn đối tác' : null
  });
  else if (!isAP) rules.customerId = v => !v ? 'Chọn khách hàng' : null;
  const validateAll = bindValidation(form, rules, preview);
  preview();
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!validateAll()) return;
    const fd = Object.fromEntries(new FormData(form));
    const payload = { id: id || undefined, no: fd.no.trim(), desc: fd.desc.trim(), due: fd.due };
    if (!locked) Object.assign(payload, { issued: fd.issued, subtotal: Math.round(+fd.subtotal), vatRate: +fd.vatRate });
    if (isAP && !locked) payload.supplierId = fd.supplierId;
    if (!isAP) Object.assign(payload, { customerId: fd.customerId, projectId: fd.projectId || '' });
    const ok = await run(() => API.saveInvoice(type, payload), isEdit ? 'Đã cập nhật hóa đơn' : 'Đã tạo hóa đơn');
    if (ok) afterSave();
  });
}

function downloadBackup() {

function handleRestoreFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try {
      const j = JSON.parse(reader.result);
      data = j.app === 'BuildLedger' && j.data ? j.data : j;
      if (!Array.isArray(data.materials) || !Array.isArray(data.movements)) throw new Error();
      validateState(normalizeState(data));
    } catch (e) { return toast('File không hợp lệ hoặc không phải file sao lưu BuildLedger', 'error'); }
    const n = normalizeState(data);
    const msg = `File của <b>${esc(n.company.name || 'không tên')}</b>: ${n.materials.length} vật tư, ${n.movements.length} phiếu, ${n.projects.length} dự án, ${n.payables.length + n.receivables.length} hóa đơn.<br><br>` +
      (Store.real ? '<b class="text-rose-600">Toàn bộ dữ liệu hiện tại trên trình duyệt này sẽ bị thay thế.</b>' : 'Dữ liệu sẽ được nạp vào trình duyệt này.');
    const doRestore = () => { Store.replaceReal(n); renderWelcome(); navigate('dashboard'); toast('Đã khôi phục dữ liệu từ file sao lưu'); };
    if (!Store.real && !Store.mode) { $('#welcome-root').innerHTML = ''; document.body.style.overflow = ''; }
    confirmDialog({ title: 'Khôi phục dữ liệu?', danger: !!Store.real, confirmText: 'Khôi phục', message: msg, onConfirm: doRestore });
    if (!Store.mode) { // đang ở màn hình chào → nếu hủy thì hiện lại màn hình chào
      const mo = new MutationObserver(() => { if (!$('#modal-root .modal-wrap') && !Store.mode) { mo.disconnect(); renderWelcome(); } });
      mo.observe($('#modal-root'), { childList: true });
    }
  };
  reader.readAsText(file);
}

/* ============ 11. ROUTER & EVENTS ============ */
const VIEWS = {
  dashboard: { title: 'Tổng quan', sub: 'Bức tranh tài chính & vận hành theo thời gian thực', icon: 'layout-dashboard', en: 'Overview', render: renderDashboard },
  inventory: { title: 'Kho vật tư', sub: 'Danh mục, tồn kho, phiếu nhập – xuất – trả', icon: 'boxes', en: 'Inventory', render: renderInventory },
  projects:  { title: 'Dự án & Điều phối', sub: 'Tiến độ công trình, dự toán và vật tư đã xuất', icon: 'hard-hat', en: 'Projects & Logistics', render: renderProjects },
  suppliers: { title: 'Nhà cung cấp', sub: 'Hồ sơ đối tác và dư nợ phải trả', icon: 'truck', en: 'Suppliers', render: renderSuppliers },
  customers: { title: 'Khách hàng', sub: 'Chủ đầu tư và công nợ phải thu', icon: 'users', en: 'Customers', render: renderCustomers },
  ledger:    { title: 'Sổ công nợ', sub: 'Phải trả nhà cung cấp · Phải thu khách hàng', icon: 'wallet', en: 'Debt Ledger', render: renderLedger },
  settings:  { title: 'Cài đặt', sub: 'Thông tin công ty, danh mục, sao lưu dữ liệu', icon: 'settings', en: 'Settings', render: renderSettings }
};
let currentView = 'dashboard';

function renderNav() {
  const A = getAlerts();
  const badges = { inventory: A.lowStock.length, ledger: A.overdue.length, projects: A.delays.length };
  $('#nav').innerHTML = `<div class="px-3 pb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Điều hướng</div>` +
    Object.entries(VIEWS).map(([k, v]) => {
      const active = k === currentView;
      return `${k === 'settings' ? '<div class="my-3 border-t border-white/5"></div>' : ''}<button data-action="nav" data-view="${k}" class="w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition group
        ${active ? 'bg-emerald-500/10 text-white ring-1 ring-inset ring-emerald-400/20' : 'text-slate-400 hover:text-white hover:bg-white/5'}">
        <span class="${active ? 'text-emerald-400' : 'text-slate-500 group-hover:text-slate-300'}">${icon(v.icon, '!w-[18px] !h-[18px]')}</span>
        <span class="flex-1 text-left leading-tight"><span class="block font-medium">${v.title}</span><span class="block text-[11px] ${active ? 'text-emerald-300/70' : 'text-slate-500'}">${v.en}</span></span>
        ${badges[k] ? `<span class="min-w-[20px] h-5 px-1.5 rounded-full text-[11px] font-semibold grid place-items-center ${k === 'inventory' ? 'bg-amber-500/20 text-amber-300' : k === 'projects' ? 'bg-orange-500/20 text-orange-300' : 'bg-rose-500/20 text-rose-300'}">${badges[k]}</span>` : ''}
      </button>`;
    }).join('');
  const b = $('#bell-badge'); b.textContent = A.total; b.classList.toggle('hidden', !A.total);
}

function navigate(view, { keepScroll = false } = {}) {
  if (!Store.mode) return renderWelcome();
  if (!VIEWS[view]) view = 'dashboard';
  const changed = view !== currentView;
  currentView = view;
  const main = $('#view'), y = window.scrollY;
  main.classList.remove('view-enter');
  main.innerHTML = VIEWS[view].render();
  if (!keepScroll || changed) { void main.offsetWidth; main.classList.add('view-enter'); }
  $('#page-title').textContent = VIEWS[view].title;
  $('#page-sub').textContent = VIEWS[view].sub;
  document.title = `${VIEWS[view].title} · BuildLedger`;
  renderNav(); renderChrome(); refreshIcons();
  window.scrollTo(0, keepScroll && !changed ? y : 0);
  if (history.replaceState) history.replaceState(null, '', '#' + view);
  toggleSidebar(false);
}
function toggleSidebar(force) {
  const sb = $('#sidebar'), ov = $('#sidebar-overlay');
  const open = typeof force === 'boolean' ? force : sb.classList.contains('-translate-x-full');
  sb.classList.toggle('-translate-x-full', !open);
  ov.classList.toggle('hidden', !open);
}
/** Mở modal mới sau khi modal hiện tại đóng xong (tránh chồng hiệu ứng) */
const swapModal = fn => { if ($('#modal-root .modal-wrap')) { closeModal(); setTimeout(fn, 210); } else fn(); };

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const d = t.dataset;
  switch (d.action) {
    case 'nav': navigate(d.view); break;
    case 'toggle-sidebar': toggleSidebar(); break;
    case 'close-modal': closeModal(); break;
    // Màn hình chào / demo
    case 'welcome-demo': Store.startDemo(); renderWelcome(); navigate('dashboard'); toast('Đang xem dữ liệu mẫu — thay đổi sẽ không được lưu', 'info'); break;
    case 'welcome-start': renderWelcome('start'); break;
    case 'welcome-back': renderWelcome('choose'); break;
    case 'exit-demo': Store.exitDemo(); if (Store.mode) { navigate('dashboard'); toast('Đã quay về dữ liệu của bạn'); } else renderWelcome('start'); break;
    // Vật tư & phiếu
    case 'material-new': swapModal(() => openMaterialModal()); break;
    case 'material-edit': swapModal(() => openMaterialModal(d.id)); break;
    case 'material-delete': swapModal(() => confirmDeleteMaterial(d.id)); break;
    case 'mv-new': swapModal(() => openMovementModal(d.type, { projectId: d.project, materialId: d.m })); break;
    case 'mv-edit': swapModal(() => openMovementModal(null, { id: d.id })); break;
    case 'mv-delete': swapModal(() => confirmDeleteMovement(d.id)); break;
    case 'inv-tab': ui.inv.tab = d.tab; navigate('inventory', { keepScroll: true }); break;
    case 'sort': if (ui.inv.sort === d.key) ui.inv.dir *= -1; else { ui.inv.sort = d.key; ui.inv.dir = 1; } refreshInventoryTable(); break;
    case 'goto-inv-low': Object.assign(ui.inv, { tab: 'items', level: 'low', cat: 'all', q: '' }); navigate('inventory'); break;
    // Dự án
    case 'proj-filter': ui.projFilter = d.f; navigate('projects', { keepScroll: true }); break;
    case 'project-new': swapModal(() => openProjectModal()); break;
    case 'project-edit': swapModal(() => openProjectModal(d.id)); break;
    case 'project-delete': confirmDeleteProject(d.id); break;
    // NCC / KH
    case 'supplier-new': swapModal(() => openSupplierModal()); break;
    case 'supplier-edit': openSupplierModal(d.id); break;
    case 'supplier-delete': { const s = supById(d.id); if (s) confirmDialog({ title: 'Xóa nhà cung cấp?', danger: true, confirmText: 'Xóa', message: `Xóa <b>${esc(s.name)}</b>? NCC đã có phiếu nhập hoặc hóa đơn sẽ không xóa được.`,
      onConfirm: async () => { const ok = await run(() => API.deleteSupplier(d.id), 'Đã xóa nhà cung cấp'); if (ok) navigate(currentView, { keepScroll: true }); return ok; } }); break; }
    case 'supplier-ledger': Object.assign(ui.ledger, { q: d.name, ap: 'all' }); navigate('ledger'); break;
    case 'customer-new': swapModal(() => openCustomerModal()); break;
    case 'customer-edit': openCustomerModal(d.id); break;
    case 'customer-delete': { const c = cusById(d.id); if (c) confirmDialog({ title: 'Xóa khách hàng?', danger: true, confirmText: 'Xóa', message: `Xóa <b>${esc(c.name)}</b>? Khách hàng đã có dự án hoặc hóa đơn sẽ không xóa được.`,
      onConfirm: async () => { const ok = await run(() => API.deleteCustomer(d.id), 'Đã xóa khách hàng'); if (ok) navigate(currentView, { keepScroll: true }); return ok; } }); break; }
    case 'customer-ledger': Object.assign(ui.ledger, { q: d.name, ar: 'all' }); navigate('ledger'); break;
    // Công nợ
    case 'ledger-filter': ui.ledger[d.type] = d.f; refreshLedger(); break;
    case 'invoice-new': swapModal(() => openInvoiceModal(d.type)); break;
    case 'invoice-edit': openInvoiceModal(d.type, d.id); break;
    case 'invoice-delete': confirmDeleteInvoice(d.type, d.id); break;
    case 'pay': if ($('#pay-form')) openPaymentModal(d.type, d.id, d.pid || null); else swapModal(() => openPaymentModal(d.type, d.id, d.pid || null)); break;
    case 'pm-delete':
      if (t.dataset.armed) {
        run(() => API.deletePayment(d.type, d.id, d.pid), 'Đã xóa khoản thanh toán').then(ok => { if (ok) { navigate(currentView, { keepScroll: true }); openPaymentModal(d.type, d.id); } });
      } else {
        t.dataset.armed = '1'; t.innerHTML = 'Xóa?'; t.classList.add('!text-rose-600', 'bg-rose-50', 'font-semibold');
        setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.innerHTML = icon('trash-2', '!w-3.5 !h-3.5'); t.classList.remove('!text-rose-600', 'bg-rose-50', 'font-semibold'); refreshIcons(); } }, 3000);
      }
      break;
    // Cài đặt & dữ liệu
    case 'list-remove': run(() => API.removeListItem(d.kind, d.value), `Đã xóa "${d.value}"`).then(ok => ok && navigate('settings', { keepScroll: true })); break;
    case 'excel': exportExcel(d.key); break;
    case 'backup': downloadBackup(); break;
    case 'restore': $('#restore-input').value = ''; $('#restore-input').click(); break;
    case 'wipe': confirmDialog({ title: 'Xóa toàn bộ dữ liệu?', danger: true, confirmText: 'Xóa vĩnh viễn', typeToConfirm: 'XOA',
      message: 'Tất cả vật tư, phiếu, dự án, đối tác và công nợ trên trình duyệt này sẽ bị xóa vĩnh viễn. <b>Hãy tải file sao lưu trước</b> nếu cần giữ lại.',
      onConfirm: () => { Store.wipe(); closeModal(); renderWelcome(); toast('Đã xóa toàn bộ dữ liệu', 'info'); } }); break;
  }
});
document.addEventListener('input', e => {
  switch (e.target.id) {
    case 'inv-search': ui.inv.q = e.target.value; refreshInventoryTable(); break;
    case 'mv-search': ui.inv.mq = e.target.value; refreshInventoryTable(); break;
    case 'sup-search': ui.sup.q = e.target.value; $('#sup-list').innerHTML = supplierRows(); refreshIcons(); break;
    case 'cus-search': ui.cus.q = e.target.value; $('#cus-list').innerHTML = customerRows(); refreshIcons(); break;
    case 'ledger-search': ui.ledger.q = e.target.value; refreshLedger(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'inv-cat') { ui.inv.cat = e.target.value; refreshInventoryTable(); }
  if (e.target.id === 'inv-level') { ui.inv.level = e.target.value; refreshInventoryTable(); }
  if (e.target.id === 'mv-type') { ui.inv.mtype = e.target.value; refreshInventoryTable(); }
  if (e.target.id === 'restore-input' && e.target.files[0]) handleRestoreFile(e.target.files[0]);
});
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'company-form') {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(f));
    if (!fd.name.trim()) return toast('Nhập tên công ty', 'error');
    const ok = await run(() => API.saveCompany({ name: fd.name.trim(), user: fd.user.trim(), taxCode: fd.taxCode.trim() }), 'Đã lưu thông tin công ty');
    if (ok) navigate('settings', { keepScroll: true });
  } else if (f.dataset.listForm) {
    e.preventDefault();
    const v = f.elements.value.value.trim();
    if (!v) return;
    const ok = await run(() => API.addListItem(f.dataset.listForm, v), `Đã thêm "${v}"`);
    if (ok) { navigate('settings', { keepScroll: true }); $(`[data-list-form="${f.dataset.listForm}"] input`)?.focus(); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); toggleSidebar(false); } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== currentView) navigate(v); });

/* ---- Boot ---- */
(async function init() {
  Store.init();
  $('#today-label').innerHTML = `${icon('calendar', '!w-4 !h-4')} ${new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' })}`;
  if (!Store.mode) { renderWelcome(); refreshIcons(); return; }
  await API.fetchAll(); // TODO(API): tải dữ liệu từ server, hiển thị skeleton khi chờ
  const start = location.hash.slice(1);
  navigate(VIEWS[start] ? start : 'dashboard');
})();
</script>
</body>
